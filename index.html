<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050608">
  <title>Soundwave — Discover what’s next</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --sw-black-rich: #050608;
      --sw-black-midnight: rgba(6, 7, 10, 0.72);
      --sw-black-charcoal: rgba(14, 16, 22, 0.72);
      --sw-glass: rgba(6, 7, 10, 0.76);
      --sw-glass-raised: rgba(10, 12, 16, 0.62);
      --sw-glass-soft: rgba(14, 16, 22, 0.48);
      --sw-glass-border: rgba(255, 255, 255, 0.08);
      --sw-text: #f6f7fb;
      --sw-text-secondary: #a4aab8;
      --sw-text-subtle: #747c8c;
      --sw-blue: #6687ff;
      --sw-purple: #a27cff;
      --sw-pink: #ec83cf;
      --sw-hot: #ff574b;
      --sw-glow: 0 10px 40px rgba(0, 0, 0, 0.24);

      /* Mapped legacy tokens to Obsidian palette */
      --ink: var(--sw-text);
      --muted: var(--sw-text-secondary);
      --blue: var(--sw-blue);
      --violet: var(--sw-purple);
      --pink: var(--sw-pink);
      --fire: var(--sw-hot);
      --gold: #ffb81c;
      --line: var(--sw-glass-border);
      --paper: var(--sw-black-rich);
      --card: var(--sw-glass-raised);
      --card-hi: var(--sw-black-charcoal);
      --glass: var(--sw-glass);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; color-scheme: dark; }
    body {
      margin: 0;
      background: var(--sw-black-rich);
      color: var(--sw-text);
      font: 14px/1.5 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    button, input, textarea, select { font: inherit; }
    button { border: 0; background: none; cursor: pointer; color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid var(--sw-blue);
      outline-offset: 2px;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }

    /* Layout Shell */
    .app { display: grid; grid-template-columns: 222px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      background: var(--sw-black-midnight);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--sw-glass-border);
      padding: 27px 17px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 14;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 23px;
      letter-spacing: -1.35px;
      font-weight: 850;
      white-space: nowrap;
      color: var(--sw-text);
      cursor: pointer;
    }
    .brand-mark {
      width: 33px;
      height: 33px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(130deg, var(--sw-blue), var(--sw-purple) 56%, var(--sw-pink));
      color: white;
      box-shadow: 0 5px 20px rgba(162, 124, 255, 0.34);
      font-size: 20px;
    }
    .brand-dot { color: var(--sw-pink); }
    .sidebar-label {
      margin: 32px 12px 10px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--sw-text-subtle);
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 13px;
      border-radius: 13px;
      padding: 12px 14px;
      text-align: left;
      width: 100%;
      color: var(--sw-text-secondary);
      font-weight: 600;
      margin: 3px 0;
      transition: background .15s, color .15s;
      border: 1px solid transparent;
    }
    .nav .glyph { font-size: 18px; width: 22px; text-align: center; font-weight: 400; }
    .nav.active {
      background: linear-gradient(135deg, rgba(102, 135, 255, 0.16), rgba(162, 124, 255, 0.14));
      color: var(--sw-text);
      border-color: var(--sw-glass-border);
    }
    .nav:hover { background: var(--sw-glass-soft); color: var(--sw-text); }
    .side-bottom {
      margin-top: auto;
      border-radius: 16px;
      padding: 17px 14px;
      background: var(--sw-glass-raised);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sw-glass-border);
      box-shadow: var(--sw-glow);
      font-size: 12px;
    }
    .side-bottom b { font-size: 14px; color: var(--sw-text); }
    .side-bottom p { color: var(--sw-text-secondary); margin: 7px 0 14px; }

    /* Topbar & Main */
    .main { min-width: 0; padding-bottom: 108px; }
    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 clamp(20px, 3vw, 48px);
      border-bottom: 1px solid var(--sw-glass-border);
      background: var(--sw-glass);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 12;
    }
    .topbrand { display: none; }
    .search {
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      border-radius: 30px;
      padding: 10px 17px;
      display: flex;
      gap: 9px;
      align-items: center;
      max-width: 340px;
      flex: 1;
      color: var(--sw-text-subtle);
    }
    .search:focus-within { border-color: var(--sw-blue); box-shadow: 0 0 0 3px rgba(102, 135, 255, 0.18); }
    .search input { background: none; border: 0; outline: none; color: var(--sw-text); width: 100%; min-width: 0; font-size: 12px; }
    .search input::placeholder { color: var(--sw-text-subtle); }
    .topactions { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 37px;
      height: 37px;
      border-radius: 50%;
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      display: grid;
      place-items: center;
      color: var(--sw-text);
      font-size: 11px;
      font-weight: 800;
    }

    /* Buttons & Badges */
    .btn {
      border-radius: 30px;
      padding: 11px 17px;
      font-size: 12px;
      font-weight: 700;
      transition: transform .17s, box-shadow .17s, background .17s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.primary {
      background: linear-gradient(135deg, var(--sw-blue), var(--sw-purple));
      color: #fff;
      box-shadow: 0 6px 20px rgba(102, 135, 255, 0.28);
    }
    .btn.light { background: var(--sw-text); color: var(--sw-black-rich); }
    .btn.ghost { border: 1px solid var(--sw-glass-border); background: var(--sw-black-charcoal); color: var(--sw-text); }
    .btn.ghost:hover { background: var(--sw-glass-raised); }
    .btn.gold {
      background: linear-gradient(135deg, #ffb81c, #ff6a00);
      color: #fff;
      box-shadow: 0 6px 20px rgba(255, 153, 0, 0.28);
    }
    .btn.danger { background: rgba(255, 87, 75, 0.16); border: 1px solid rgba(255, 87, 75, 0.35); color: #fca5a5; }

    .vip-badge {
      background: linear-gradient(135deg, #ffb81c, #ea580c);
      color: #fff;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .7px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .live-badge {
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .6px;
    }
    .yt-badge {
      background: rgba(255, 87, 75, 0.16);
      border: 1px solid rgba(255, 87, 75, 0.38);
      color: #fca5a5;
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    /* Headings & Content */
    .content { max-width: 1500px; margin: 0 auto; padding: 30px clamp(20px, 3vw, 48px); }
    .eyebrow {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      font-weight: 800;
      color: var(--sw-text-subtle);
    }
    .heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .heading h1 {
      margin: 6px 0 4px;
      font-size: clamp(26px, 3vw, 39px);
      letter-spacing: -1.35px;
      line-height: 1.12;
      color: var(--sw-text);
    }
    .sub { color: var(--sw-text-secondary); font-size: 13px; margin: 0; }
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 100%;
      vertical-align: middle;
      margin-right: 6px;
      box-shadow: 0 0 11px #10b981;
    }

    /* Home Grid & Vertical Reel Stage */
    .home-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(290px, 375px);
      gap: 25px;
      align-items: start;
    }
    .reel-wrap { min-width: 0; }
    .reel-shell {
      height: min(68vh, 700px);
      min-height: 540px;
      border-radius: 24px;
      background: #020304;
      border: 1px solid var(--sw-glass-border);
      position: relative;
      overflow: hidden;
      color: var(--sw-text);
      box-shadow: var(--sw-glow);
    }
    .reel-media { position: absolute; inset: 0; }
    .reel-media img, .reel-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 28%;
      display: block;
      transition: transform 0.6s ease;
    }
    .reel-shell.is-playing .reel-media img {
      transform: scale(1.04);
    }
    .yt-frame { width: 100%; height: 100%; border: 0; display: block; background: #020304; }
    .reel-dim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(2, 3, 4, 0.56) 0%, transparent 28%, transparent 42%, rgba(2, 3, 4, 0.72) 70%, rgba(2, 3, 4, 0.96) 100%);
      pointer-events: none;
    }
    .reel-top {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 2;
    }
    .glasslabel {
      border-radius: 30px;
      padding: 8px 13px;
      background: var(--sw-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sw-glass-border);
      font-size: 11px;
      font-weight: 700;
      color: var(--sw-text);
    }
    .reel-indicator {
      font-size: 11px;
      color: var(--sw-text);
      background: var(--sw-glass);
      border: 1px solid var(--sw-glass-border);
      backdrop-filter: blur(20px);
      padding: 6px 11px;
      border-radius: 20px;
    }
    .reel-arrows {
      position: absolute;
      right: 18px;
      top: 64px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 3;
    }
    .reel-arrows button {
      display: grid;
      place-items: center;
      background: var(--sw-glass);
      color: var(--sw-text);
      border: 1px solid var(--sw-glass-border);
      backdrop-filter: blur(20px);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      transition: background .15s, transform .15s;
    }
    .reel-arrows button:hover {
      background: var(--sw-black-charcoal);
      border-color: var(--sw-blue);
      transform: scale(1.06);
    }
    .reel-bottom {
      position: absolute;
      left: 24px;
      right: 86px;
      bottom: 26px;
      max-width: 470px;
      z-index: 2;
    }
    .reel-bottom h2 {
      font-size: clamp(28px, 4vw, 46px);
      letter-spacing: -1.6px;
      line-height: 1.04;
      margin: 9px 0 10px;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.75);
    }
    .artistline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 700; }
    .follow {
      font-weight: 700;
      font-size: 11px;
      padding: 5px 11px;
      border: 1px solid var(--sw-glass-border);
      color: var(--sw-text);
      border-radius: 30px;
      background: var(--sw-glass-soft);
      backdrop-filter: blur(12px);
      transition: all .15s;
    }
    .follow.subbed { background: var(--sw-blue); border-color: var(--sw-blue); color: #fff; }
    .reel-description { color: var(--sw-text-secondary); font-size: 12px; margin: 0 0 16px; max-width: 410px; }
    .reel-btns { display: flex; gap: 9px; flex-wrap: wrap; }

    /* Right-side Reel Actions */
    .reel-actions {
      position: absolute;
      right: 18px;
      bottom: 24px;
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 12px;
      z-index: 2;
    }
    .action {
      color: var(--sw-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 600;
      min-width: 44px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
      transition: transform .15s;
    }
    .action:hover { transform: scale(1.08); }
    .action .acticon { font-size: 22px; line-height: 1.05; }
    .action.selected { color: var(--sw-pink); }
    .action.gold { color: #ffd166; }

    /* Equalizer Bars when playing */
    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
      margin-right: 4px;
    }
    .eq-bars i {
      width: 2.5px;
      background: #10b981;
      border-radius: 2px;
      animation: eq 0.7s infinite ease-in-out alternate;
    }
    .eq-bars i:nth-child(2) { animation-delay: 0.2s; }
    .eq-bars i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes eq { 0% { height: 3px; } 100% { height: 12px; } }

    /* Right Rail & Cards */
    .rail { display: flex; flex-direction: column; gap: 16px; }
    .rail-card {
      background: var(--sw-glass-raised);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sw-glass-border);
      border-radius: 20px;
      padding: 21px 20px;
      box-shadow: var(--sw-glow);
    }
    .rail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .rail-head h2 { margin: 0; font-size: 20px; letter-spacing: -.7px; color: var(--sw-text); }
    .rail-note { margin: 3px 0 14px; color: var(--sw-text-secondary); font-size: 11px; }
    .fire-label { color: var(--sw-hot); font-size: 10px; letter-spacing: 1.1px; font-weight: 800; text-transform: uppercase; }

    /* Track Rows */
    .track-row { display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--sw-glass-border); padding: 12px 0; }
    .track-rank { width: 20px; text-align: center; color: var(--sw-text-subtle); font-size: 14px; font-weight: 800; }
    .track-rank.first { color: var(--sw-hot); }
    .cover {
      position: relative;
      aspect-ratio: 1;
      background: var(--sw-black-charcoal);
      overflow: hidden;
      border-radius: 11px;
      border: 1px solid var(--sw-glass-border);
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .25s; position: relative; z-index: 1; }
    .cover-fallback { position: absolute; inset: 0; display: grid; place-items: center; color: var(--sw-text); font-weight: 800; font-size: 16px; }
    .track-cover { width: 47px; height: 47px; flex-shrink: 0; cursor: pointer; }
    .track-cover:hover img, .music-tile:hover img { transform: scale(1.04); }
    .track-name {
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--sw-text);
    }
    .track-small { font-size: 11px; color: var(--sw-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-body { flex: 1; min-width: 0; cursor: pointer; }

    .vote {
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      color: var(--sw-blue);
      border-radius: 30px;
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }
    .vote:hover { border-color: var(--sw-blue); color: var(--sw-text); }
    .vote.voted {
      background: linear-gradient(135deg, var(--sw-blue), var(--sw-purple));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(102, 135, 255, 0.3);
    }
    .rate-pill {
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      color: #ffca57;
      border-radius: 30px;
      padding: 6px 9px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }
    .text-link { color: var(--sw-blue); font-size: 12px; font-weight: 700; }
    .hot-link { color: var(--sw-hot); }

    /* Sponsored Card */
    .sponsor {
      border: 1px solid var(--sw-glass-border);
      background: var(--sw-glass-raised);
      backdrop-filter: blur(20px);
      box-shadow: var(--sw-glow);
      border-radius: 20px;
      padding: 19px 20px;
      position: relative;
      overflow: hidden;
    }
    .sponsor:after {
      content: '';
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 100%;
      background: rgba(162, 124, 255, 0.14);
      filter: blur(32px);
      right: -65px;
      top: -80px;
      pointer-events: none;
    }
    .sponsor-tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--sw-text-subtle); text-transform: uppercase; }
    .sponsor h3 { font-size: 19px; letter-spacing: -.6px; margin: 9px 0 7px; color: var(--sw-text); }
    .sponsor p { color: var(--sw-text-secondary); font-size: 11px; margin: 0 0 15px; max-width: 270px; }
    .promo-link { background: var(--sw-black-charcoal); border: 1px solid var(--sw-glass-border); color: var(--sw-text); border-radius: 30px; padding: 9px 13px; font-size: 11px; font-weight: 700; }
    .sponsor-art {
      height: 84px;
      position: relative;
      overflow: hidden;
      border-radius: 13px;
      background: var(--sw-black-midnight);
      border: 1px solid var(--sw-glass-border);
      margin: 12px 0 14px;
    }
    .sponsor-art img { width: 100%; height: 100%; object-fit: cover; opacity: .55; filter: saturate(.85); }
    .sponsor-art span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--sw-text);
      font-weight: 850;
      font-size: 14px;
      letter-spacing: 1.8px;
      text-shadow: 0 2px 9px #000;
    }

    /* Genre Browse Grid & Showcase */
    .bottom-strip {
      margin-top: 25px;
      background: var(--sw-glass-raised);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sw-glass-border);
      box-shadow: var(--sw-glow);
      border-radius: 20px;
      padding: 23px 25px;
    }
    .strip-head { display: flex; justify-content: space-between; align-items: center; gap: 13px; margin-bottom: 17px; }
    .strip-head h2 { margin: 5px 0 0; font-size: 20px; letter-spacing: -.6px; color: var(--sw-text); }
    .chips { display: flex; gap: 7px; overflow: auto; padding-bottom: 14px; scrollbar-width: none; }
    .chip {
      border: 1px solid var(--sw-glass-border);
      background: var(--sw-black-charcoal);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--sw-text-secondary);
    }
    .chip:hover { color: var(--sw-text); border-color: rgba(255, 255, 255, 0.2); }
    .chip.active { background: rgba(102, 135, 255, 0.18); color: var(--sw-text); border-color: var(--sw-blue); }
    .music-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
    .music-tile { text-align: left; min-width: 0; }
    .music-tile .cover { border-radius: 14px; }
    .music-tile .track-name { margin-top: 9px; }

    .release-showcase {
      margin-top: 24px;
      border-radius: 23px;
      padding: 24px 25px 26px;
      background: var(--sw-glass-raised);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sw-glass-border);
      color: var(--sw-text);
      overflow: hidden;
      position: relative;
      box-shadow: var(--sw-glow);
    }
    .release-showcase-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .release-showcase .eyebrow { color: var(--sw-purple); }
    .release-showcase h2 { font-size: 24px; letter-spacing: -.6px; margin: 3px 0 2px; }
    .release-showcase-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; }
    .release-big {
      border: 1px solid var(--sw-glass-border);
      background: var(--sw-black-midnight);
      border-radius: 17px;
      min-height: 245px;
      position: relative;
      overflow: hidden;
      text-align: left;
      padding: 0;
      isolation: isolate;
    }
    .release-big > img {
      width: 100%;
      height: 100%;
      object-fit: cover;

  const fmtTime = (s) => {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${sec < 10 ? '0' : ''}${sec}`;
  };
  const timeAgo = (iso) => {
    if (!iso) return 'Just now';
    const sec = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (sec < 60) return 'Just now';
    if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
    if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
    return Math.floor(sec / 86400) + 'd ago';

  async function syncFromSupabase() {
    if (!sb) return;
    try {
      const [{ data: dbTracks }, { data: dbSubs }, { data: dbProfs }, { data: dbEng }] = await Promise.all([
        sb.from('tracks').select('*').order('created_at', { ascending: false }),
        sb.from('subscriptions').select('*'),
        sb.from('profiles').select('*'),
        sb.from('engagement').select('*')
      ]);
      liveSubCounts = {};
      const myRemoteSubs = [];
      (dbSubs || []).forEach(s => {
        liveSubCounts[s.artist] = (liveSubCounts[s.artist] || 0) + 1;
        if (s.device_id === state.deviceId) myRemoteSubs.push(s.artist);
      });
      if (myRemoteSubs.length) {
        state.follows = Array.from(new Set([...state.follows, ...myRemoteSubs]));
        saveState();
      }
      (dbProfs || []).forEach(p => { artistProfiles[p.artist_name] = p; });
      const engMap = {};
      (dbEng || []).forEach(e => { engMap[e.item_id] = e; });

      const realTracks = (dbTracks || []).map(r => {
        const ytId = parseYouTubeId(r.audio_url);
        return {
          id: r.id,
          isMock: false,
          userId: r.user_id,
          artist: r.artist,
          title: r.title,
          genre: r.genre,
          description: r.description,
          url: r.audio_url,
          ytId,
          img: r.cover_url || (ytId ? `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg` : ''),
          fallbackImg: '',
          video: r.is_video,
          vip: r.vip,
          votes: r.votes || 1,
          likes: r.likes || 0,
          ratingSum: r.rating_sum || 5,
          ratingCount: r.rating_count || 1,
          color: '#4a61f0'
        };
      });

      const syncedSamples = samples.map(s => {
        const e = engMap[s.id];
        if (!e) return { ...s };
        return {
          ...s,
          votes: s.votes + (e.votes || 0),
          likes: s.likes + (e.likes || 0),
          ratingSum: s.ratingSum + (e.rating_sum || 0),
          ratingCount: s.ratingCount + (e.rating_count || 0)
        };
      });

      const prevId = current()?.id;
      tracks = SHOW_MOCKS ? [...realTracks, ...syncedSamples] : realTracks;
      const foundIdx = tracks.findIndex(x => x.id === prevId);
      currentIndex = foundIdx >= 0 ? foundIdx : 0;
      if (location.hash.startsWith('#@')) {
        const hName = decodeURIComponent(location.hash.slice(2));
        if (hName) openArtistPage(hName);
      } else {
        render();
      }
    } catch (err) {
      console.error('Supabase sync error:', err);
    }
  }

  let ttObserver = null;
  function setupTikTokFeed() {
    const feedEl = $('#tt-feed');
    if (!feedEl) return;
    if (ttObserver) ttObserver.disconnect();
    const targetSlide = feedEl.querySelector(`.tt-slide[data-slideidx="${currentIndex}"]`);
    if (targetSlide) targetSlide.scrollIntoView({ behavior: 'instant' });

    ttObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting && entry.intersectionRatio > 0.65) {
          const idx = Number(entry.target.dataset.slideidx);
          if (idx !== currentIndex) {
            currentIndex = idx;
            progress = 0;
            curTime = 0;
            durTime = 0;
            if (userInteracted) {
              startPlaybackForCurrent();
            } else {
              audio.pause();
              playing = false;
            }
            document.querySelectorAll('.tt-slide').forEach((slideEl) => {
              const sIdx = Number(slideEl.dataset.slideidx);
              const isAct = sIdx === currentIndex && playing;
              slideEl.classList.toggle('is-playing', isAct);
              const badgeWrap = slideEl.querySelector('.tt-center-play');
              if (badgeWrap) {
                const locked = isLocked(tracks[sIdx]);
                badgeWrap.innerHTML = isAct ? '' : `<span class="tt-play-badge">${locked ? '🔒' : '▶'}</span>`;
              }
            });
            const t = current();
            const pTitle = document.querySelector('.player-title');
            if (pTitle && t) {
              const r = getTrackRating(t);
              pTitle.dataset.openartist = t.artist;
              pTitle.innerHTML = `<div class="track-name">${esc(t.title)} ${t.vip ? '<span class="vip-badge">VIP</span>' : ''}</div><div class="track-small">@${esc(t.artist)} · ★ ${r.avg}</div>`;
            }
            const pPlay = document.querySelector('.play-circle');
            if (pPlay) pPlay.textContent = playing ? 'Ⅱ' : '▶';
          }
        }
      });
    }, { root: feedEl, threshold: 0.65 });

    feedEl.querySelectorAll('.tt-slide').forEach((s) => ttObserver.observe(s));
  }

  function render() {
    document.body.classList.toggle('is-reels', page === 'Feed');
    const t = current();
    const r = t ? getTrackRating(t) : { avg: '5.0', count: 0 };
    const artistHandle = getArtistDisplay();
    const initials = artistHandle ? artistHandle.slice(0, 2).toUpperCase() : 'SW';

    $('#app').innerHTML = `
      <div class="app">
        <aside class="sidebar">
          <div class="brand" data-nav="Home"><span class="brand-mark">∿</span>soundwave<span class="brand-dot">.</span></div>
          <div class="sidebar-label">MUSIC</div>
          ${sections.map(([name, glyph, label]) => `
            <button class="nav ${page === name ? 'active' : ''}" data-nav="${name}">
              <span class="glyph">${glyph}</span>${label}
            </button>`).join('')}
          ${currentUser ? `
            <button class="nav ${page === 'Artist' && selectedArtist === artistHandle ? 'active' : ''}" data-openartist="${esc(artistHandle)}">
              <span class="glyph">@</span>My Artist Page
            </button>` : ''}
          <div class="sidebar-label">YOUR COMMUNITY</div>
          <button class="nav" data-nav="Charts" style="color:#ff6b64"><span class="glyph">♨</span>Trending songs</button>
          <button class="nav" data-openartist="LONEK"><span class="glyph">✦</span>Featured: @LONEK</button>
          <div class="side-bottom">
            <b>${currentUser ? `@${esc(artistHandle)}` : 'Your music belongs here.'}</b>
            <p>${currentUser ? 'Manage your artist page, post to fans & upload.' : 'Create a free account to claim your artist page.'}</p>
            <button class="btn primary" data-nav="Studio">${currentUser ? 'Upload music ↗' : 'Join & Upload ↗'}</button>
          </div>
        </aside>

        <main class="main">
          <header class="topbar">
            <div class="topbrand" data-nav="Home"><span class="brand-mark">∿</span>sw<span class="brand-dot">.</span></div>
            <div class="search">⌕ <input id="search" type="search" placeholder="Search songs, artists, genres" value="${esc(query)}" aria-label="Search music"></div>
            <div class="topactions">
              <button class="btn primary top-upload" data-nav="Studio">＋ Upload music</button>
              ${currentUser
                ? `<button class="avatar" data-action="profile" title="@${esc(artistHandle)}">${esc(initials)}</button>`
                : `<button class="btn ghost" data-action="openauth">Log In / Sign Up</button>`}
            </div>
          </header>

          <div class="content">
            ${page === 'Home' ? home()
              : page === 'Feed' ? feed()
              : page === 'Charts' ? charts()
              : page === 'Studio' ? studio()
              : page === 'Library' ? library()
              : page === 'Artist' ? artistPage()
              : searchPage()}
            <div class="footer-note">SOUNDWAVE · Dark Studio Community Music Network</div>
          </div>
        </main>
      </div>

      ${t ? `
        <div class="player">
          <button class="track-cover" style="border-radius:10px;flex-shrink:0" data-action="player" aria-label="Open player">${cover(t)}</button>
          <div class="player-title" data-openartist="${esc(t.artist)}">
            <div class="track-name">${esc(t.title)} ${t.vip ? '<span class="vip-badge">VIP</span>' : ''}</div>
            <div class="track-small">@${esc(t.artist)} · ★ ${r.avg}</div>
          </div>
          <button aria-label="Rate song" data-action="rate" style="font-size:17px;color:var(--gold);font-weight:800">★ ${state.ratings[t.id] || ''}</button>
          <button aria-label="Save song" data-action="save" style="font-size:21px;color:${has('saved', t.id) ? '#ec6ec4' : '#7e85a3'}">${has('saved', t.id) ? '♥' : '♡'}</button>
          <button class="skip" aria-label="Previous track" data-action="prev">⏮</button>
          <button class="play-circle" aria-label="Play or pause" data-action="play">${playing ? 'Ⅱ' : '▶'}</button>
          <button class="skip" aria-label="Next track" data-action="next">⏭</button>
          <div class="progress-wrap">
            <div class="progress" id="scrub" title="Click to seek"><i style="width:${progress}%"></i></div>
            <span class="time-label">${fmtTime(curTime)} / ${fmtTime(durTime || 135)}</span>
          </div>
        </div>` : ''}

      <nav class="mobile-nav">
        ${sections.map(([name, glyph, label]) => `
          <button class="${page === name ? 'active' : ''}" data-nav="${name}">
            <span>${glyph}</span>${label}
          </button>`).join('')}
      </nav>
      ${modalHTML()}
    `;

    if (page === 'Feed') setupTikTokFeed();

    const el = $('#reel');
    if (el) {
      let y = 0;
      let last = 0;
      el.addEventListener('touchstart', e => { y = e.touches[0].clientY; }, { passive: true });
      el.addEventListener('touchend', e => {
        const dy = y - e.changedTouches[0].clientY;
        if (Math.abs(dy) > 45) move(dy > 0 ? 1 : -1);
      }, { passive: true });
      el.addEventListener('wheel', e => {
        e.preventDefault();
        if (Math.abs(e.deltaY) > 17 && Date.now() - last > 450) {
          last = Date.now();
          move(e.deltaY > 0 ? 1 : -1);
        }
      }, { passive: false });
    }
  }

  function toast(s) {
    const d = document.createElement('div');
    d.className = 'toast';
    d.textContent = s;
    document.body.append(d);
    setTimeout(() => d.remove(), 2500);
  }

  function choose(i) {
    audio.pause();
    playing = false;
    progress = 0;
    curTime = 0;
    durTime = 0;
    currentIndex = i;
    if (page === 'Feed') {
      const feedEl = $('#tt-feed');
      const targetSlide = feedEl?.querySelector(`.tt-slide[data-slideidx="${i}"]`);
      if (targetSlide) {
        targetSlide.scrollIntoView({ behavior: 'smooth' });
        return;
      }
    }
    render();
  }

  function pool() {
    return all().filter(x => tab === 'For You' || has('follows', x.t.artist));
  }

  function move(d) {
    const p = page === 'Feed' ? pool() : all();
    if (!p.length) return toast('Subscribe to an artist first to populate this feed');
    const at = p.findIndex(x => x.i === currentIndex);
    choose(p[(at + d + p.length) % p.length].i);
  }

  function startPlaybackForCurrent() {
    const t = current();
    if (!t) return;
    document.querySelectorAll('.tt-vid').forEach(v => { v.pause(); v.muted = true; });
    if (isLocked(t)) {
      audio.pause();
      playing = false;
      return;
    }
    playing = true;
    if (t.ytId) {
      audio.pause();
      return;
    }
    const vid = $(`.tt-vid[data-vididx="${currentIndex}"]`) || $('#reel-video');
    if (t.video && vid) {
      audio.pause();
      vid.muted = false;
      vid.play().catch(() => { playing = false; });
      return;
    }
    if (t.url) {
      if (audio.src !== t.url) audio.src = t.url;
      audio.play().catch(() => { playing = false; });
    }
  }

  function togglePlay() {
    const t = current();
    if (!t) return;
    userInteracted = true;
    if (isLocked(t)) {
      openArtistPage(t.artist);
      return toast(`Subscribe to @${t.artist} to unlock this VIP track`);
    }
    if (playing) {
      playing = false;
      audio.pause();
      document.querySelectorAll('video').forEach(v => v.pause());
      render();
    } else {
      startPlaybackForCurrent();
      render();
    }
  }

  async function syncMockEngagement(trackObj, deltaVotes, deltaLikes, deltaRatingSum, deltaRatingCount) {
    if (!sb) return;
    const { data: existing } = await sb.from('engagement').select('*').eq('item_id', trackObj.id).maybeSingle();
    const payload = {
      item_id: trackObj.id,
      votes: Math.max(0, (existing?.votes || 0) + deltaVotes),
      likes: Math.max(0, (existing?.likes || 0) + deltaLikes),
      rating_sum: Math.max(0, (existing?.rating_sum || 0) + deltaRatingSum),
      rating_count: Math.max(0, (existing?.rating_count || 0) + deltaRatingCount)
    };
    await sb.from('engagement').upsert(payload);
  }

  function toggleSubscribeArtist(artistName) {
    const wasSubbed = has('follows', artistName);
    flip('follows', artistName);
    if (sb) {
      if (!wasSubbed) {
        liveSubCounts[artistName] = (liveSubCounts[artistName] || 0) + 1;
        sb.from('subscriptions').upsert({ artist: artistName, device_id: state.deviceId }).then();
      } else {
        liveSubCounts[artistName] = Math.max(0, (liveSubCounts[artistName] || 1) - 1);
        sb.from('subscriptions').delete().match({ artist: artistName, device_id: state.deviceId }).then();
      }
    }
    toast(has('follows', artistName) ? `Subscribed to @${artistName}! VIP access unlocked` : `Unsubscribed from @${artistName}`);
  }

  document.addEventListener('click', async (e) => {
    const scrub = e.target.closest('#scrub');
    if (scrub) {
      const rect = scrub.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      progress = pct * 100;
      const vid = $(`.tt-vid[data-vididx="${currentIndex}"]`) || $('#reel-video');
      if (current()?.video && vid && vid.duration) {
        vid.currentTime = pct * vid.duration;
        curTime = vid.currentTime;
      } else if (audio.duration) {
        audio.currentTime = pct * audio.duration;
        curTime = audio.currentTime;
      }
      document.querySelectorAll('.progress i, .tt-progress i').forEach(el => el.style.width = progress + '%');
      return;
    }

    if (e.target.closest('[data-action="tapplay"]')) {
      togglePlay();
      return;
    }

    const b = e.target.closest('button,[data-track],[data-openartist],[data-subartist],[data-nav]');
    if (!b) return;
    const d = b.dataset;
    const a = d.action;
    const t = current();

    if (d.upsrc) { uploadSource = d.upsrc; render(); return; }
    if (d.openartist) { openArtistPage(d.openartist); return; }
    if (d.subartist) { toggleSubscribeArtist(d.subartist); render(); return; }
    if (d.copyartist) {
      const url = `https://soundwaves.space/#@${encodeURIComponent(d.copyartist)}`;
      try {
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        toast(`Artist page link copied: #@${d.copyartist}`);
      } catch {
        toast(url);
      }
      return;
    }
    if (a === 'togglebio') { editingBio = !editingBio; render(); return; }
    if (d.authmode) { authMode = d.authmode; render(); return; }
    if (a === 'openauth') { modal = 'auth'; render(); return; }
    if (a === 'logout') {
      if (sb) await sb.auth.signOut();
      currentUser = null;
      userArtistName = '';
      modal = '';
      render();
      toast('Logged out');
      return;
    }
    if (d.deltrack) {
      if (sb) await sb.from('tracks').delete().eq('id', d.deltrack);
      await syncFromSupabase();
      toast('Release deleted');
      return;
    }

    if (d.nav) {
      page = d.nav;
      modal = '';
      genre = 'All';
      if (page === 'Feed') tab = 'For You';
      try { history.replaceState(null, '', location.pathname); } catch {}
      render();
      scrollTo(0, 0);
      return;
    }
    if (d.genre) { genre = d.genre; render(); return; }
    if (d.tab) {
      tab = d.tab;
      page = 'Feed';
      modal = '';
      const p = pool();
      if (p.length) currentIndex = p[0].i;
      else { tab = 'For You'; toast('Subscribe to an artist to populate this feed'); }
      render();
      return;
    }
    if (d.track !== undefined) { choose(Number(d.track)); modal = 'player'; render(); return; }
    if (d.rate !== undefined) { currentIndex = Number(d.rate); modal = 'rate'; render(); return; }
    if (d.setrate !== undefined) {
      const stars = Number(d.setrate);
      const prev = state.ratings[t.id] || 0;
      const deltaSum = stars - prev;
      const deltaCount = prev ? 0 : 1;
      state.ratings[t.id] = stars;
      saveState();
      modal = '';
      t.ratingSum = (t.ratingSum || 5) + deltaSum;
      t.ratingCount = (t.ratingCount || 1) + deltaCount;
      if (!t.isMock) {
        if (sb) sb.from('tracks').update({ rating_sum: t.ratingSum, rating_count: t.ratingCount }).eq('id', t.id).then();
      } else {
        syncMockEngagement(t, 0, 0, deltaSum, deltaCount);
      }
      render();
      toast(`Rated "${t.title}" ${stars} ★`);
      return;
    }
    if (d.like !== undefined) {
      const target = tracks[Number(d.like)];
      const wasLiked = has('likes', target.id);
      const delta = wasLiked ? -1 : 1;
      flip('likes', target.id);
      target.likes = Math.max(0, (target.likes || 0) + delta);
      if (!target.isMock) {
        if (sb) sb.from('tracks').update({ likes: target.likes }).eq('id', target.id).then();
      } else {
        syncMockEngagement(target, 0, delta, 0, 0);
      }
      render();
      return;
    }
    if (d.vote !== undefined) {
      const target = tracks[Number(d.vote)];
      const wasVoted = has('votes', target.id);
      const delta = wasVoted ? -1 : 1;
      flip('votes', target.id);
      target.votes = Math.max(0, (target.votes || 0) + delta);
      if (!target.isMock) {
        if (sb) sb.from('tracks').update({ votes: target.votes }).eq('id', target.id).then();
      } else {
        syncMockEngagement(target, delta, 0, 0, 0);
      }
      render();
      toast('Community chart vote updated');
      return;
    }
    if (a === 'prev' || a === 'next') { move(a === 'next' ? 1 : -1); return; }
    if (a === 'play') { togglePlay(); return; }
    if (a === 'save') { flip('saved', t.id); toast(has('saved', t.id) ? 'Added to My Music' : 'Removed from My Music'); }
    if (['player', 'comments', 'share', 'profile', 'promote', 'rate'].includes(a)) {
      modal = a;
      if (a === 'comments' && t) loadTrackComments(t.id);
    }
    if (a === 'close') modal = '';
    if (a === 'copy') {
      const v = `${t.artist} — ${t.title} on Soundwave · https://soundwaves.space/#@${encodeURIComponent(t.artist)}`;
      try {
        const ta = document.createElement('textarea');
        ta.value = v;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        toast('Song link copied');
      } catch {
        toast(v);
      }
      return;
    }
    render();
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'search' && e.key === 'Enter') {
      query = e.target.value;
      page = 'Search';
      render();
    } else if ((page === 'Home' || page === 'Feed') && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName) && !modal) {
      if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    }
    if (e.key === 'Escape' && modal) { modal = ''; render(); }
  });

  document.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = new FormData(e.target);

    if (e.target.id === 'bio-form') {
      if (!currentUser || !sb) return;
      const bio = String(data.get('bio') || '').trim();
      const social_link = String(data.get('social_link') || '').trim();
      const handle = getArtistDisplay();
      await sb.from('profiles').upsert({ id: currentUser.id, artist_name: handle, bio, social_link });
      artistProfiles[handle] = { id: currentUser.id, artist_name: handle, bio, social_link };
      editingBio = false;
      render();
      toast('Artist profile updated!');
      return;
    }

    if (e.target.id === 'wall-post-form') {
      if (!currentUser || !sb) return;
      const body = String(data.get('body') || '').trim();
      const vip_only = Boolean(data.get('vip_only'));
      const handle = getArtistDisplay();
      if (!body) return;
      const { error } = await sb.from('artist_posts').insert({ user_id: currentUser.id, artist: handle, body, vip_only });
      if (!error) {
        e.target.reset();
        await openArtistPage(handle);
        toast('Posted to your community wall!');
      } else {
        toast(error.message);
      }
      return;
    }

    if (e.target.classList.contains('wall-reply-form')) {
      const pid = e.target.dataset.postid;
      const replyTxt = String(data.get('reply') || '').trim();
      if (replyTxt && pid) {
        const prefix = userArtistName ? `@${userArtistName}: ` : 'Fan: ';
        const fullReply = prefix + replyTxt;
        const key = 'post_' + pid;
        (state.comments[key] ??= []).push(fullReply);
        saveState();
        render();
        if (sb) sb.from('comments').insert({ track_id: key, body: fullReply }).then();
        toast('Reply posted');
      }
      return;
    }

    if (e.target.id === 'auth-form') {
      if (!sb || authLoading) return;
      const email = String(data.get('email')).trim();
      const password = String(data.get('password'));
      const artistName = String(data.get('artist_name') || '').trim();
      authLoading = true;
      render();
      try {
        if (authMode === 'signup') {
          const { data: res, error } = await sb.auth.signUp({
            email,
            password,
            options: { data: { artist_name: artistName } }
          });
          if (error) throw error;
          if (res.user) {
            await sb.from('profiles').upsert({ id: res.user.id, artist_name: artistName });
            userArtistName = artistName;
          }
          toast(`Welcome to Soundwave, @${artistName}!`);
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          toast('Logged in!');
        }
        modal = '';
        await syncUserSession();
      } catch (err) {
        toast(err.message || 'Authentication error');
      } finally {
        authLoading = false;
        render();
      }
      return;
    }

    if (e.target.id === 'upload') {
      if (uploading) return;
      if (!currentUser) {
        modal = 'auth';
        render();
        return toast('Please sign up or log in first');
      }
      const artistName = getArtistDisplay();
      const title = String(data.get('title')).trim();
      const trackGenre = String(data.get('genre'));
      const description = String(data.get('description')).trim();
      const image = data.get('cover');
      const activeSource = ALLOW_YOUTUBE ? uploadSource : 'file';

      if (image?.size && image.size > MAX_COVER_MB * 1024 * 1024) {
        return toast(`Cover image must be under ${MAX_COVER_MB}MB`);
      }

      if (sb) {
        uploading = true;
        render();
        try {
          const ts = Date.now();
          let audioUrl = '', isVideo = false, vip = false, ytId = '';

          if (activeSource === 'youtube') {
            const rawYt = String(data.get('youtube_url') || '').trim();
            ytId = parseYouTubeId(rawYt);
            if (!ytId) throw new Error('Please enter a valid YouTube link');
            audioUrl = `https://www.youtube.com/watch?v=${ytId}`;
            isVideo = true;
          } else {
            const media = data.get('media');
            if (!media?.size) throw new Error('Choose an audio or video file');
            if (media.size > MAX_MEDIA_MB * 1024 * 1024) throw new Error(`File too large (max ${MAX_MEDIA_MB}MB)`);
            const mediaExt = (media.name.split('.').pop() || 'mp3').replace(/\W/g, '');
            const mediaPath = `${currentUser.id}/${ts}_${Math.random().toString(36).slice(2, 7)}.${mediaExt}`;
            const { error: mErr } = await sb.storage.from('soundwave').upload(mediaPath, media, { contentType: media.type });
            if (mErr) throw mErr;
            audioUrl = sb.storage.from('soundwave').getPublicUrl(mediaPath).data.publicUrl;
            isVideo = media.type.startsWith('video/');
            vip = Boolean(data.get('vip'));
          }

          let coverUrl = ytId ? `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg` : '';
          if (image?.size) {
            const imgExt = (image.name.split('.').pop() || 'jpg').replace(/\W/g, '');
            const imgPath = `${currentUser.id}/cover_${ts}_${Math.random().toString(36).slice(2, 7)}.${imgExt}`;
            const { error: iErr } = await sb.storage.from('soundwave').upload(imgPath, image, { contentType: image.type });
            if (!iErr) coverUrl = sb.storage.from('soundwave').getPublicUrl(imgPath).data.publicUrl;
          }

          const { error: dbErr } = await sb.from('tracks').insert({
            user_id: currentUser.id,
            artist: artistName,
            title,
            genre: trackGenre,
            description,
            audio_url: audioUrl,
            cover_url: coverUrl,
            is_video: isVideo,
            vip
          });
          if (dbErr) throw dbErr;

          if (!has('follows', artistName)) flip('follows', artistName);
          uploading = false;
          page = 'Home';
          genre = 'All';
          playing = false;
          audio.pause();
          await syncFromSupabase();
          currentIndex = 0;
          render();
          scrollTo(0, 0);
          toast('Your release is now LIVE on Soundwave!');
        } catch (err) {
          uploading = false;
          render();
          toast(err.message || 'Upload failed');
        }
        return;
      }
    }

    if (e.target.id === 'comment') {
      const txt = String(data.get('comment') || '').trim();
      if (txt && current()) {
        const tid = current().id;
        const prefix = userArtistName ? `@${userArtistName}: ` : '';
        const fullTxt = prefix + txt;
        (state.comments[tid] ??= []).unshift(fullTxt);
        saveState();
        render();
        if (sb) sb.from('comments').insert({ track_id: tid, body: fullTxt }).then();
        toast('Feedback posted');
      }
    }
  });

  setInterval(() => {
    if (playing) {
      const vid = $(`.tt-vid[data-vididx="${currentIndex}"]`) || $('#reel-video');
      if (current()?.video && vid && vid.duration) {
        curTime = vid.currentTime;
        durTime = vid.duration;
        progress = (curTime / durTime) * 100;
      } else if (current()?.url && !current()?.ytId && audio.duration) {
        curTime = audio.currentTime;
        durTime = audio.duration;
        progress = (curTime / durTime) * 100;
      } else {
        progress = (progress + 0.5) % 100;
        curTime = (progress / 100) * 135;
        durTime = 135;
      }
      document.querySelectorAll('.progress i, .tt-progress i').forEach(e => e.style.width = progress + '%');
      document.querySelectorAll('.time-label').forEach(e => e.textContent = `${fmtTime(curTime)} / ${fmtTime(durTime || 135)}`);
    }
  }, 300);

  audio.addEventListener('ended', () => {
    playing = false;
    progress = 0;
    curTime = 0;
    render();
  });

  render();
  syncUserSession();
  syncFromSupabase();
</script>
</body>
</html>
