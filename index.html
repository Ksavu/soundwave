<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050608">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SpotWav — Discover what’s next</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --sw-black-rich: #050608;
      --sw-black-midnight: #090B0F;
      --sw-black-charcoal: #151820;
      --sw-glass: rgba(8, 9, 13, 0.78);
      --sw-glass-raised: rgba(12, 14, 19, 0.65);
      --sw-glass-soft: rgba(12, 14, 19, 0.48);
      --sw-glass-border: rgba(255, 255, 255, 0.08);
      --sw-text: #f6f7fb;
      --sw-text-secondary: #a4aab8;
      --sw-text-subtle: #747c8c;
      --sw-blue: #6687ff;
      --sw-purple: #a27cff;
      --sw-pink: #ec83cf;
      --sw-hot: #ff574b;
      --sw-glow: 0 10px 40px rgba(0, 0, 0, 0.24);

      --ink: var(--sw-text);
      --muted: var(--sw-text-secondary);
      --blue: var(--sw-blue);
      --violet: var(--sw-purple);
      --pink: var(--sw-pink);
      --fire: var(--sw-hot);
      --gold: #ffb81c;
      --line: var(--sw-glass-border);
      --paper: var(--sw-black-rich);
      --card: var(--sw-glass-raised);
      --card-hi: var(--sw-black-charcoal);
      --glass: var(--sw-glass);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; color-scheme: dark; }
    body {
      margin: 0;
      background: var(--sw-black-rich);
      color: var(--sw-text);
      font: 14px/1.5 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    button, input, textarea, select { font: inherit; }
    button { border: 0; background: none; cursor: pointer; color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid var(--sw-blue);
      outline-offset: 2px;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }

    /* Layout Shell */
    .app { display: grid; grid-template-columns: 222px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      background: var(--sw-black-midnight);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--sw-glass-border);
      padding: 27px 17px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 14;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 23px;
      letter-spacing: -1.35px;
      font-weight: 850;
      white-space: nowrap;
      color: var(--sw-text);
      cursor: pointer;
    }
    .brand-mark {
      width: 33px;
      height: 33px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(130deg, var(--sw-blue), var(--sw-purple) 56%, var(--sw-pink));
      color: white;
      box-shadow: 0 5px 20px rgba(162, 124, 255, 0.34);
      font-size: 20px;
    }
    .brand-dot { color: var(--sw-pink); }
    .sidebar-label {
      margin: 28px 12px 10px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--sw-text-subtle);
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 13px;
      border-radius: 13px;
      padding: 11px 14px;
      text-align: left;
      width: 100%;
      color: var(--sw-text-secondary);
      font-weight: 600;
      margin: 2px 0;
      transition: background .15s, color .15s;
      border: 1px solid transparent;
    }
    .nav .glyph { font-size: 18px; width: 22px; text-align: center; font-weight: 400; }
    .nav.active {
      background: linear-gradient(135deg, rgba(102, 135, 255, 0.16), rgba(162, 124, 255, 0.14));
      color: var(--sw-text);
      border-color: var(--sw-glass-border);
    }
    .nav:hover { background: var(--sw-glass-soft); color: var(--sw-text); }
    .side-bottom {
      margin-top: auto;
      border-radius: 16px;
      padding: 17px 14px;
      background: var(--sw-glass-raised);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sw-glass-border);
      box-shadow: var(--sw-glow);
      font-size: 12px;
    }
    .side-bottom b { font-size: 14px; color: var(--sw-text); }
    .side-bottom p { color: var(--sw-text-secondary); margin: 7px 0 14px; }

    /* Topbar & Main */
    .main { min-width: 0; padding-bottom: 108px; }
    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 clamp(20px, 3vw, 48px);
      border-bottom: 1px solid var(--sw-glass-border);
      background: var(--sw-glass);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 12;
    }
    .topbrand { display: none; }
    .search {
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      border-radius: 30px;
      padding: 10px 17px;
      display: flex;
      gap: 9px;
      align-items: center;
      max-width: 340px;
      flex: 1;
      color: var(--sw-text-subtle);
    }
    .search:focus-within { border-color: var(--sw-blue); box-shadow: 0 0 0 3px rgba(102, 135, 255, 0.18); }
    .search input { background: none; border: 0; outline: none; color: var(--sw-text); width: 100%; min-width: 0; font-size: 12px; }
    .search input::placeholder { color: var(--sw-text-subtle); }
    .topactions { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 37px;
      height: 37px;
      border-radius: 50%;
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      display: grid;
      place-items: center;
      color: var(--sw-text);
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* Buttons & Badges */
    .btn {
      border-radius: 30px;
      padding: 11px 17px;
      font-size: 12px;
      font-weight: 700;
      transition: transform .17s, box-shadow .17s, background .17s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.primary {
      background: linear-gradient(135deg, var(--sw-blue), var(--sw-purple));
      color: #fff;
      box-shadow: 0 6px 20px rgba(102, 135, 255, 0.28);
    }
    .btn.light { background: var(--sw-text); color: var(--sw-black-rich); }
    .btn.ghost { border: 1px solid var(--sw-glass-border); background: var(--sw-black-charcoal); color: var(--sw-text); }
    .btn.ghost:hover { background: var(--sw-glass-raised); }
    .btn.gold {
      background: linear-gradient(135deg, #ffb81c, #ff6a00);
      color: #fff;
      box-shadow: 0 6px 20px rgba(255, 153, 0, 0.28);
    }
    .btn.danger { background: rgba(255, 87, 75, 0.16); border: 1px solid rgba(255, 87, 75, 0.35); color: #fca5a5; }

    .vip-badge {
      background: linear-gradient(135deg, #ffb81c, #ea580c);
      color: #fff;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .7px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .live-badge {
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .6px;
    }
    .yt-badge {
      background: rgba(255, 87, 75, 0.16);
      border: 1px solid rgba(255, 87, 75, 0.38);
      color: #fca5a5;
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    /* Headings & Content */
    .content { max-width: 1500px; margin: 0 auto; padding: 30px clamp(20px, 3vw, 48px); }
    .eyebrow {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      font-weight: 800;
      color: var(--sw-text-subtle);
    }
    .heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .heading h1 {
      margin: 6px 0 4px;
      font-size: clamp(26px, 3vw, 39px);
      letter-spacing: -1.35px;
      line-height: 1.12;
      color: var(--sw-text);
    }
    .sub { color: var(--sw-text-secondary); font-size: 13px; margin: 0; }
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 100%;
      vertical-align: middle;
      margin-right: 6px;
      box-shadow: 0 0 11px #10b981;
    }

    /* Home Grid & Vertical Reel Stage */
    .home-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(290px, 375px);
      gap: 25px;
      align-items: start;
    }
    .reel-wrap { min-width: 0; }
    .reel-shell {
      height: min(64vh, 640px);
      min-height: 500px;
      max-width: 660px;
      margin: 0 auto;
      border-radius: 32px;
      background: #020304;
      border: 1px solid var(--sw-glass-border);
      position: relative;
      overflow: hidden;
      color: var(--sw-text);
      box-shadow: var(--sw-glow);
    }
    .reel-media { position: absolute; inset: 0; }
    .reel-media img, .reel-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 28%;
      display: block;
      transition: transform 0.6s ease;
    }
    .reel-shell.is-playing .reel-media img { transform: scale(1.04); }
    .yt-frame { width: 100%; height: 100%; border: 0; display: block; background: #020304; }
    .reel-dim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(2, 3, 4, 0.56) 0%, transparent 28%, transparent 42%, rgba(2, 3, 4, 0.72) 70%, rgba(2, 3, 4, 0.96) 100%);
      pointer-events: none;
    }
    .reel-top {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }
    .glasslabel {
      border-radius: 30px;
      padding: 8px 13px;
      background: var(--sw-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sw-glass-border);
      font-size: 11px;
      font-weight: 700;
      color: var(--sw-text);
    }
    .reel-indicator {
      font-size: 11px;
      color: var(--sw-text);
      background: var(--sw-glass);
      border: 1px solid var(--sw-glass-border);
      backdrop-filter: blur(20px);
      padding: 6px 11px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .reel-arrows {
      position: absolute;
      right: 16px;
      top: 62px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 3;
    }
    .reel-arrows button {
      display: grid;
      place-items: center;
      background: var(--sw-glass);
      color: var(--sw-text);
      border: 1px solid var(--sw-glass-border);
      backdrop-filter: blur(20px);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 17px;
      transition: background .15s, transform .15s;
    }
    .reel-arrows button:hover {
      background: var(--sw-black-charcoal);
      border-color: var(--sw-blue);
      transform: scale(1.06);
    }
    .reel-bottom {
      position: absolute;
      left: 24px;
      right: 76px;
      bottom: 26px;
      max-width: 470px;
      z-index: 2;
    }
    .reel-bottom h2 {
      font-size: clamp(28px, 4vw, 46px);
      letter-spacing: -1.6px;
      line-height: 1.04;
      margin: 9px 0 10px;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.75);
    }
    .artistline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 700; }
    .follow {
      font-weight: 700;
      font-size: 11px;
      padding: 5px 11px;
      border: 1px solid var(--sw-glass-border);
      color: var(--sw-text);
      border-radius: 30px;
      background: var(--sw-glass-soft);
      backdrop-filter: blur(12px);
      transition: all .15s;
    }
    .follow.subbed { background: var(--sw-blue); border-color: var(--sw-blue); color: #fff; }
    .reel-description { color: var(--sw-text-secondary); font-size: 12px; margin: 0 0 16px; max-width: 410px; }
    .reel-btns { display: flex; gap: 9px; flex-wrap: wrap; }

    /* Right-side Reel Actions (clean gap below scroll arrows) */
    .reel-actions {
      position: absolute;
      right: 16px;
      top: 176px;
      bottom: auto;
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 11px;
      z-index: 2;
    }
    .action {
      color: var(--sw-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 600;
      min-width: 40px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
      transition: transform .15s;
    }
    .action:hover { transform: scale(1.08); }
    .action .acticon { font-size: 20px; line-height: 1.05; }
    .action.selected { color: var(--sw-pink); }
    .action.gold { color: #ffd166; }

    /* Right Rail & Cards */
    .rail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .rail-card {
      background: var(--sw-glass-raised);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sw-glass-border);
      border-radius: 20px;
      padding: 21px 20px;
      box-shadow: var(--sw-glow);
      min-width: 0;
    }
    .rail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .rail-head h2 { margin: 0; font-size: 20px; letter-spacing: -.7px; color: var(--sw-text); }
    .rail-note { margin: 3px 0 14px; color: var(--sw-text-secondary); font-size: 11px; }
    .fire-label { color: var(--sw-hot); font-size: 10px; letter-spacing: 1.1px; font-weight: 800; text-transform: uppercase; }

    /* Track Rows */
    .track-row { display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--sw-glass-border); padding: 12px 0; min-width: 0; }
    .track-rank { width: 20px; text-align: center; color: var(--sw-text-subtle); font-size: 14px; font-weight: 800; flex-shrink: 0; }
    .track-rank.first { color: var(--sw-hot); }
    .cover {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--sw-black-charcoal);
      overflow: hidden;
      border-radius: 11px;
      border: 1px solid var(--sw-glass-border);
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; object-position: center; transition: transform .25s; position: relative; z-index: 1; }
    .cover-fallback { position: absolute; inset: 0; display: grid; place-items: center; color: var(--sw-text); font-weight: 800; font-size: 16px; }
    .track-cover { width: 47px; height: 47px; flex-shrink: 0; cursor: pointer; }
    .track-cover:hover img, .music-tile:hover img { transform: scale(1.04); }
    .track-name {
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--sw-text);
    }
    .track-small { font-size: 11px; color: var(--sw-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-body { flex: 1; min-width: 0; cursor: pointer; }

    .vote {
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      color: var(--sw-blue);
      border-radius: 30px;
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .vote:hover { border-color: var(--sw-blue); color: var(--sw-text); }
    .vote.voted {
      background: linear-gradient(135deg, var(--sw-blue), var(--sw-purple));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(102, 135, 255, 0.3);
    }
    .rate-pill {
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      color: #ffca57;
      border-radius: 30px;
      padding: 6px 9px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .text-link { color: var(--sw-blue); font-size: 12px; font-weight: 700; }
    .hot-link { color: var(--sw-hot); }

    /* Sponsored Card */
    .sponsor {
      border: 1px solid var(--sw-glass-border);
      background: var(--sw-glass-raised);
      backdrop-filter: blur(20px);
      box-shadow: var(--sw-glow);
      border-radius: 20px;
      padding: 19px 20px;
      position: relative;
      overflow: hidden;
    }
    .sponsor:after {
      content: '';
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 100%;
      background: rgba(162, 124, 255, 0.14);
      filter: blur(32px);
      right: -65px;
      top: -80px;
      pointer-events: none;
    }
    .sponsor-tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--sw-text-subtle); text-transform: uppercase; }
    .sponsor h3 { font-size: 19px; letter-spacing: -.6px; margin: 9px 0 7px; color: var(--sw-text); }
    .sponsor p { color: var(--sw-text-secondary); font-size: 11px; margin: 0 0 15px; max-width: 270px; }
    .promo-link { background: var(--sw-black-charcoal); border: 1px solid var(--sw-glass-border); color: var(--sw-text); border-radius: 30px; padding: 9px 13px; font-size: 11px; font-weight: 700; }
    .sponsor-art {
      height: 84px;
      position: relative;
      overflow: hidden;
      border-radius: 13px;
      background: var(--sw-black-midnight);
      border: 1px solid var(--sw-glass-border);
      margin: 12px 0 14px;
    }
    .sponsor-art img { width: 100%; height: 100%; object-fit: cover; opacity: .55; filter: saturate(.85); }
    .sponsor-art span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--sw-text);
      font-weight: 850;
      font-size: 14px;
      letter-spacing: 1.8px;
      text-shadow: 0 2px 9px #000;
    }

    /* Genre Browse Grid & Showcase */
    .bottom-strip {
      margin-top: 25px;
      background: var(--sw-glass-raised);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sw-glass-border);
      box-shadow: var(--sw-glow);
      border-radius: 20px;
      padding: 23px 25px;
    }
    .strip-head { display: flex; justify-content: space-between; align-items: center; gap: 13px; margin-bottom: 17px; }
    .strip-head h2 { margin: 5px 0 0; font-size: 20px; letter-spacing: -.6px; color: var(--sw-text); }
    .chips { display: flex; gap: 7px; overflow: auto; padding-bottom: 14px; scrollbar-width: none; }
    .chip {
      border: 1px solid var(--sw-glass-border);
      background: var(--sw-black-charcoal);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--sw-text-secondary);
    }
    .chip:hover { color: var(--sw-text); border-color: rgba(255, 255, 255, 0.2); }
    .chip.active { background: rgba(102, 135, 255, 0.18); color: var(--sw-text); border-color: var(--sw-blue); }
    .music-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
    .music-tile { text-align: left; min-width: 0; }
    .music-tile .cover { border-radius: 14px; }
    .music-tile .track-name { margin-top: 9px; }

    .release-showcase {
      margin-top: 24px;
      border-radius: 23px;
      padding: 24px 25px 26px;
      background: var(--sw-glass-raised);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sw-glass-border);
      color: var(--sw-text);
      overflow: hidden;
      position: relative;
      box-shadow: var(--sw-glow);
    }
    .release-showcase-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .release-showcase-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
    .release-big {
      border: 1px solid var(--sw-glass-border);
      background: var(--sw-black-midnight);
      border-radius: 18px;
      aspect-ratio: 1 / 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      text-align: left;
      padding: 0;
      isolation: isolate;
    }
    .release-big > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      position: absolute;
      inset: 0;
      transition: transform .4s;
    }
    .release-big:hover > img { transform: scale(1.04); }
    .release-big:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 42%, rgba(5, 6, 8, 0.92) 100%);
      z-index: 0;
    }
    .release-big-meta {
      position: absolute;
      bottom: 18px;
      left: 19px;
      right: 19px;
      color: var(--sw-text);
      z-index: 1;
      display: flex;
      gap: 3px;
      flex-direction: column;
    }
    .release-big-meta small { font-size: 9px; letter-spacing: 1.3px; color: var(--sw-purple); font-weight: 800; }
    .release-big-meta strong { font-size: 24px; letter-spacing: -.6px; }
    .release-big-meta > span { font-size: 11px; color: var(--sw-text-secondary); }
    .release-side { display: flex; flex-direction: column; justify-content: space-between; gap: 13px; min-width: 0; }
    .release-mini {
      display: flex;
      align-items: center;
      gap: 15px;
      flex: 1;
      padding: 12px;
      border-radius: 16px;
      background: var(--sw-glass-soft);
      border: 1px solid var(--sw-glass-border);
      text-align: left;
      color: var(--sw-text);
      transition: background .15s;
    }
    .release-mini:hover { background: var(--sw-black-charcoal); }
    .release-mini img { height: 108px; width: 108px; aspect-ratio: 1 / 1; object-fit: cover; object-position: center; border-radius: 12px; flex-shrink: 0; }
    .release-mini span { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .release-mini strong { font-size: 16px; line-height: 1.1; display: flex; align-items: center; gap: 6px; }
    .release-mini small { color: var(--sw-text-secondary); font-size: 11px; }

    /* Charts, Studio, Artist Hub */
    .board { background: var(--sw-glass-raised); backdrop-filter: blur(20px); padding: 17px 22px; border-radius: 22px; border: 1px solid var(--sw-glass-border); box-shadow: var(--sw-glow); }
    .board .track-row { padding: 15px 0; }
    .board .track-cover { width: 55px; height: 55px; }
    .board .track-rank { width: 36px; }
    .board .track-name { font-size: 14px; }
    .board-intro {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      background: var(--sw-glass-raised);
      border: 1px solid var(--sw-glass-border);
      box-shadow: var(--sw-glow);
      padding: 21px 24px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .board-intro h2 { margin: 3px 0; font-size: 22px; letter-spacing: -.7px; color: var(--sw-text); }
    .board-intro p { margin: 3px 0; font-size: 12px; color: var(--sw-text-secondary); }

    .studio-layout { display: grid; grid-template-columns: minmax(300px, 670px) minmax(220px, 320px); gap: 22px; }
    .panel { background: var(--sw-glass-raised); backdrop-filter: blur(20px); padding: 23px; border-radius: 20px; border: 1px solid var(--sw-glass-border); box-shadow: var(--sw-glow); }
    .panel h2, .panel h3 { margin: 0 0 4px; letter-spacing: -.4px; color: var(--sw-text); }
    .field { display: flex; flex-direction: column; gap: 7px; margin-top: 16px; font-size: 12px; font-weight: 700; color: var(--sw-text); }
    .field input, .field select, .field textarea {
      border: 1px solid var(--sw-glass-border);
      background: var(--sw-black-charcoal);
      border-radius: 12px;
      padding: 12px 13px;
      width: 100%;
      color: var(--sw-text);
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--sw-blue); }
    .note { font-size: 11px; color: var(--sw-text-subtle); }
    .empty { padding: 30px; text-align: center; color: var(--sw-text-subtle); font-size: 13px; }

    .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0; }
    .stat { background: var(--sw-glass-raised); border: 1px solid var(--sw-glass-border); border-radius: 17px; padding: 16px; }
    .stat strong { display: block; font-size: 22px; color: var(--sw-blue); }
    .stat span { color: var(--sw-text-secondary); font-size: 11px; }
    .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 330px); gap: 20px; }

    /* Artist Hub & Wall */
    .artist-hero {
      background: var(--sw-glass-raised);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sw-glass-border);
      color: var(--sw-text);
      padding: 30px 28px;
      border-radius: 24px;
      margin-bottom: 22px;
      box-shadow: var(--sw-glow);
    }
    .artist-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
    .artist-avatar-lg {
      width: 74px;
      height: 74px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--sw-blue), var(--sw-pink));
      display: grid;
      place-items: center;
      font-size: 26px;
      font-weight: 850;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 8px 28px rgba(102, 135, 255, 0.35);
    }
    .artist-stats-bar {
      display: flex;
      gap: 24px;
      margin: 18px 0 0;
      padding: 14px 18px;
      background: var(--sw-glass-soft);
      border: 1px solid var(--sw-glass-border);
      border-radius: 16px;
      flex-wrap: wrap;
    }
    .artist-stats-bar div strong { display: block; font-size: 19px; color: var(--sw-text); }
    .artist-stats-bar div span { font-size: 11px; color: var(--sw-text-secondary); }
    .wall-post { border-top: 1px solid var(--sw-glass-border); padding: 16px 0; }
    .wall-post:first-child { border-top: 0; padding-top: 4px; }
    .wall-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; color: var(--sw-text); }
    .wall-body { font-size: 13px; color: var(--sw-text); line-height: 1.55; white-space: pre-wrap; }
    .wall-replies { margin-top: 10px; padding-left: 12px; border-left: 2px solid var(--sw-glass-border); display: flex; flex-direction: column; gap: 6px; }
    .wall-reply { font-size: 12px; color: var(--sw-text-secondary); background: var(--sw-black-charcoal); border: 1px solid var(--sw-glass-border); padding: 7px 11px; border-radius: 10px; }

    .auth-tabs { display: flex; gap: 8px; margin: 14px 0; }
    .auth-tab {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      font-weight: 700;
      font-size: 12px;
      color: var(--sw-text-secondary);
    }
    .auth-tab.active { background: var(--sw-blue); border-color: var(--sw-blue); color: #fff; }

    /* WavePoints & SpotWav Rewards System */
    .wp-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      padding: 7px 13px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 800;
      color: var(--sw-text);
      transition: transform .15s, border-color .15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .wp-pill:hover { transform: translateY(-1px); border-color: var(--sw-purple); }
    .wp-gem {
      display: inline-grid;
      place-items: center;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--sw-blue), var(--sw-purple), var(--sw-pink));
      color: #fff;
      font-size: 10px;
      font-weight: 900;
    }
    .level-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      background: rgba(162, 124, 255, 0.16);
      border: 1px solid rgba(162, 124, 255, 0.35);
      color: #d8c7ff;
    }
    .wp-bar {
      height: 8px;
      border-radius: 20px;
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      overflow: hidden;
      margin: 10px 0 6px;
    }
    .wp-bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--sw-blue), var(--sw-purple), var(--sw-pink));
      border-radius: 20px;
      transition: width .4s ease;
    }
    .rewards-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .reward-card {
      background: var(--sw-glass-raised);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sw-glass-border);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--sw-glow);
      transition: transform .18s, border-color .18s;
    }
    .reward-card:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.18); }
    .reward-art {
      aspect-ratio: 16 / 9;
      border-radius: 13px;
      overflow: hidden;
      background: var(--sw-black-midnight);
      border: 1px solid var(--sw-glass-border);
      position: relative;
      display: grid;
      place-items: center;
    }
    .reward-art img { width: 100%; height: 100%; object-fit: cover; }
    .challenge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0;
      border-top: 1px solid var(--sw-glass-border);
    }
    .challenge-row:first-of-type { border-top: 0; }
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .ach-badge {
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
      opacity: .42;
      transition: opacity .2s, border-color .2s;
    }
    .ach-badge.unlocked {
      opacity: 1;
      border-color: rgba(162, 124, 255, 0.45);
      background: linear-gradient(145deg, rgba(102, 135, 255, 0.12), rgba(162, 124, 255, 0.12));
    }
    .tier-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .tier-card {
      background: var(--sw-glass-raised);
      border: 1px solid var(--sw-glass-border);
      border-radius: 22px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--sw-glow);
    }
    .tier-card.featured {
      border-color: rgba(162, 124, 255, 0.48);
      background: linear-gradient(160deg, rgba(20, 24, 38, 0.85), rgba(12, 14, 19, 0.78));
    }
    .impact-meter {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .impact-box {
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      border-radius: 14px;
      padding: 12px;
    }
    .impact-box strong { display: block; font-size: 17px; color: var(--sw-text); }
    .impact-box span { font-size: 10px; color: var(--sw-text-secondary); }

    /* Bottom Audio Player */
    .player {
      position: fixed;
      bottom: 13px;
      left: calc(222px + 18px);
      right: 18px;
      max-width: 1470px;
      margin: 0 auto;
      background: var(--sw-glass);
      backdrop-filter: blur(24px);
      border: 1px solid var(--sw-glass-border);
      box-shadow: var(--sw-glow);
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 15px;
      z-index: 15;
      min-width: 0;
    }
    .player .cover { width: 45px; height: 45px; flex-shrink: 0; }
    .play-circle {
      background: linear-gradient(135deg, var(--sw-blue), var(--sw-purple));
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 17px;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(102, 135, 255, 0.35);
    }
    .progress-wrap { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 60px; }
    .progress { height: 7px; border-radius: 20px; background: var(--sw-black-charcoal); flex: 1; overflow: hidden; cursor: pointer; position: relative; }
    .progress i { display: block; width: 0; height: 100%; background: linear-gradient(90deg, var(--sw-blue), var(--sw-purple), var(--sw-pink)); border-radius: 20px; pointer-events: none; }
    .time-label { font-size: 11px; color: var(--sw-text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .player-title { min-width: 110px; max-width: 220px; flex: 1; cursor: pointer; }
    .player-title div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Modals & Toast */
    .mobile-nav { display: none; }
    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(5, 6, 8, 0.82);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .modal {
      max-width: 460px;
      width: 100%;
      max-height: 86vh;
      overflow: auto;
      background: var(--sw-black-midnight);
      border: 1px solid var(--sw-glass-border);
      border-radius: 24px;
      padding: 26px;
      box-shadow: var(--sw-glow);
      color: var(--sw-text);
    }
    .modal h2 { font-size: 23px; letter-spacing: -.7px; margin: 11px 0 4px; color: var(--sw-text); }
    .modal p { font-size: 13px; color: var(--sw-text-secondary); }
    .modal .cover { max-width: 215px; margin: 15px auto; }
    .close { font-size: 23px; float: right; color: var(--sw-text-secondary); }
    .toast {
      position: fixed;
      z-index: 100;
      bottom: 105px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--sw-black-charcoal);
      border: 1px solid var(--sw-glass-border);
      color: var(--sw-text);
      border-radius: 25px;
      padding: 12px 20px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: var(--sw-glow);
      white-space: nowrap;
    }
    .footer-note { font-size: 10px; color: var(--sw-text-subtle); padding: 20px 2px; }
    .star-picker { display: flex; justify-content: center; gap: 8px; margin: 18px 0; }
    .star-btn { font-size: 34px; color: var(--sw-black-charcoal); transition: transform .15s, color .15s; }
    .star-btn:hover, .star-btn.on { color: var(--gold); transform: scale(1.12); }

    /* TikTok-style Vertical Snap Reels View (Mobile + Desktop) */
    .tiktok-feed {
      height: calc(100vh - 155px);
      min-height: 540px;
      max-height: 760px;
      max-width: 440px;
      margin: 0 auto;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      background: #020304;
      border-radius: 32px;
      border: 1px solid var(--sw-glass-border);
      box-shadow: var(--sw-glow);
      position: relative;
    }
    .tiktok-feed::-webkit-scrollbar { display: none; }
    .tt-slide {
      height: 100%;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      overflow: hidden;
      color: var(--sw-text);
      background: #020304;
    }
    .tt-slide .reel-media img, .tt-slide .reel-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 28%;
    }
    .tt-top {
      position: sticky;
      top: 14px;
      left: 0;
      right: 0;
      padding: 0 16px;
      z-index: 18;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      height: 0;
    }
    .tt-tabs {
      display: flex;
      gap: 14px;
      pointer-events: auto;
      background: var(--sw-glass);
      backdrop-filter: blur(20px);
      padding: 7px 15px;
      border-radius: 30px;
      border: 1px solid var(--sw-glass-border);
      margin-top: 28px;
    }
    .tt-tabs button { color: var(--sw-text-secondary); font-size: 13px; font-weight: 700; }
    .tt-tabs button.active {
      color: var(--sw-text);
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-thickness: 2px;
    }
    .tt-top .glasslabel { pointer-events: auto; margin-top: 28px; }
    .tt-center-play {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 2;
      pointer-events: none;
    }
    .tt-play-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--sw-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sw-glass-border);
      display: grid;
      place-items: center;
      font-size: 24px;
      color: var(--sw-text);
      box-shadow: var(--sw-glow);
    }
    .tt-bottom {
      position: absolute;
      left: 20px;
      right: 76px;
      bottom: 28px;
      z-index: 3;
    }
    .tt-bottom h2 {
      font-size: 30px;
      letter-spacing: -1px;
      line-height: 1.06;
      margin: 8px 0 8px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }
    .tt-actions {
      position: absolute;
      right: 14px;
      top: 176px;
      bottom: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 4;
    }
    .tt-arrows {
      position: absolute;
      right: 14px;
      top: 64px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 5;
    }
    .tt-arrows button {
      display: grid;
      place-items: center;
      background: var(--sw-glass);
      color: var(--sw-text);
      border: 1px solid var(--sw-glass-border);
      backdrop-filter: blur(20px);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 16px;
    }
    .tt-arrows button:hover { background: var(--sw-black-charcoal); border-color: var(--sw-blue); }
    .tt-progress {
      position: sticky;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.14);
      z-index: 22;
      cursor: pointer;
    }
    .tt-progress i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--sw-blue), var(--sw-purple), var(--sw-pink));
    }

    @media(max-width: 1180px) {
      .app { grid-template-columns: 184px minmax(0, 1fr); }
      .sidebar { padding: 24px 10px; }
      .brand { font-size: 19px; }
      .home-layout { grid-template-columns: minmax(0, 1fr) minmax(240px, 310px); gap: 15px; }
      .music-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .rewards-grid, .tier-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .player { left: 202px; }
      .content { padding: 24px; }
      .topbar { padding: 0 24px; }
      .reel-shell { min-height: 520px; }
    }
    @media(max-width: 850px) {
      .sidebar { display: none; }
      .app { display: block; }
      .topbrand { display: flex; font-weight: 850; align-items: center; gap: 6px; font-size: 20px; letter-spacing: -.8px; color: var(--sw-text); }
      .topbrand .brand-mark { height: 28px; width: 28px; font-size: 17px; }
      .home-layout { grid-template-columns: minmax(0, 1fr); }
      .rail { display: grid; grid-template-columns: 1fr 1fr; }
      .reel-shell { height: 590px; }
      .player { left: 14px; right: 14px; bottom: 75px; }
      .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--sw-glass);
        backdrop-filter: blur(22px);
        z-index: 20;
        justify-content: space-around;
        align-items: center;
        border-top: 1px solid var(--sw-glass-border);
        padding: 6px 2px calc(8px + env(safe-area-inset-bottom));
      }
      .mobile-nav button {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 10px;
        color: var(--sw-text-subtle);
        align-items: center;
        flex: 1;
        min-width: 0;
        padding: 2px 0;
      }
      .mobile-nav .active { color: var(--sw-text); font-weight: 800; }
      .mobile-nav span { font-size: 19px; }
      .main { padding-bottom: 158px; }
      .release-showcase-grid { grid-template-columns: 1fr; }
      .release-big { aspect-ratio: 1 / 1; }
      .release-side { display: grid; grid-template-columns: 1fr 1fr; }
      .release-mini { min-width: 0; gap: 9px; }
      .release-mini img { width: 70px; height: 70px; }
      .release-mini strong { font-size: 13px; }
    }
    @media(max-width: 650px) {
      body.is-reels { background: #020304; overflow: hidden; }
      body.is-reels .topbar, body.is-reels .player, body.is-reels .footer-note, body.is-reels .reels-desktop-head { display: none !important; }
      body.is-reels .content { padding: 0; max-width: none; }
      body.is-reels .main { padding-bottom: 0; }
      body.is-reels .mobile-nav { background: var(--sw-glass); border-top: 1px solid var(--sw-glass-border); }
      body.is-reels .tiktok-feed {
        height: 100dvh;
        max-height: none;
        max-width: none;
        border-radius: 0;
        border: 0;
      }
      .tt-bottom { bottom: calc(74px + env(safe-area-inset-bottom)); left: 16px; right: 70px; }
      .tt-arrows { top: calc(56px + env(safe-area-inset-top)); right: 12px; }
      .tt-actions { top: calc(168px + env(safe-area-inset-top)); bottom: auto; right: 12px; gap: 10px; }
      .tt-progress { position: fixed; bottom: calc(54px + env(safe-area-inset-bottom)); }
      .topbar { padding: 0 12px; height: 62px; gap: 8px; }
      .topbar .top-upload { display: none; }
      .search { max-width: 145px; padding: 8px 11px; }
      .content { padding: 18px 12px; }
      .heading h1 { font-size: 26px; }

            ratingSum: r.rating_sum || 5,
            ratingCount: r.rating_count || 1,
            color: '#151820'
          };
        });

        const syncedSamples = samples.map(s => {
          const e = engMap[s.id];
          if (!e) return { ...s };
          return {
            ...s,
            votes: s.votes + (e.votes || 0),
            likes: s.likes + (e.likes || 0),
            ratingSum: s.ratingSum + (e.rating_sum || 0),
            ratingCount: s.ratingCount + (e.rating_count || 0)
          };
        });

        const prevId = current()?.id;
        tracks = SHOW_MOCKS ? [...realTracks, ...syncedSamples] : realTracks;
        const foundIdx = tracks.findIndex(x => x.id === prevId);
        currentIndex = foundIdx >= 0 ? foundIdx : 0;
        if (location.hash.startsWith('#@')) {
          const hName = decodeURIComponent(location.hash.slice(2));
          if (hName) openArtistPage(hName);
        } else {
          render();
        }
      } catch (err) {
        console.error('Supabase sync error:', err);
      }
    }

    let ttObserver = null;
    function setupTikTokFeed() {
      const feedEl = $('#tt-feed');
      if (!feedEl) return;
      if (ttObserver) ttObserver.disconnect();
      const targetSlide = feedEl.querySelector(`.tt-slide[data-slideidx="${currentIndex}"]`);
      if (targetSlide) targetSlide.scrollIntoView({ behavior: 'instant' });

      ttObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && entry.intersectionRatio > 0.65) {
            const idx = Number(entry.target.dataset.slideidx);
            if (idx !== currentIndex) {
              currentIndex = idx;
              progress = 0;
              curTime = 0;
              durTime = 0;
              if (userInteracted) {
                startPlaybackForCurrent();
              } else {
                audio.pause();
                playing = false;
              }
              document.querySelectorAll('.tt-center-play').forEach(el => {
                const sIdx = Number(el.closest('.tt-slide').dataset.slideidx);
                const locked = isLocked(tracks[sIdx]);
                el.innerHTML = (sIdx === currentIndex && playing) ? '' : `<span class="tt-play-badge">${locked ? '🔒' : '▶'}</span>`;
              });
            }
          }
        });
      }, { root: feedEl, threshold: 0.65 });
      feedEl.querySelectorAll('.tt-slide').forEach(s => ttObserver.observe(s));
    }

      const artistHandle = getArtistDisplay();
      const initials = artistHandle ? artistHandle.slice(0, 2).toUpperCase() : 'SW';
      $('#app').innerHTML = `<div class="app">
        <aside class="sidebar">
          <div class="brand" data-nav="Home"><span class="brand-mark">∿</span>spotwav<span class="brand-dot">.</span></div>
          <div class="sidebar-label">MUSIC</div>
          ${sections.map(([name, glyph, label]) => `<button class="nav ${page === name ? 'active' : ''}" data-nav="${name}"><span class="glyph">${glyph}</span>${label}</button>`).join('')}
          ${currentUser ? `<button class="nav ${page === 'Artist' && selectedArtist === artistHandle ? 'active' : ''}" data-openartist="${esc(artistHandle)}"><span class="glyph">@</span>My Artist Page</button>` : ''}
          <div class="sidebar-label">YOUR COMMUNITY</div>
          <button class="nav" data-nav="Charts" style="color:var(--sw-hot)"><span class="glyph">♨</span>Trending songs</button>
          <button class="nav" data-nav="Rewards"><span class="glyph">◈</span>${state.wpBalance.toLocaleString()} WavePoints</button>
          <div class="side-bottom">
            <b>${currentUser ? `@${esc(artistHandle)}` : 'Your music belongs here.'}</b>
            <p>${currentUser ? 'Manage your artist page, post to fans & upload.' : 'Create a free account to claim your artist page.'}</p>
            <button class="btn primary" style="width:100%" data-nav="Studio">${currentUser ? 'Upload music ↗' : 'Join & Upload ↗'}</button>
          </div>
        </aside>
        <main class="main">
          <header class="topbar">
            <div class="topbrand" data-nav="Home"><span class="brand-mark">∿</span>sw<span class="brand-dot">.</span></div>
            <div class="search">⌕ <input id="search" type="search" placeholder="Search..." value="${esc(query)}" aria-label="Search music"></div>
            <div class="topactions">
              <button class="wp-pill" data-nav="Rewards" title="WavePoints Wallet"><span class="wp-gem">W</span>${state.wpBalance.toLocaleString()} WP</button>
              <button class="btn primary top-upload" data-nav="Studio">＋ Upload</button>
              ${currentUser ? `<button class="avatar" data-action="profile" title="@${esc(artistHandle)}">${esc(initials)}</button>` : `<button class="btn ghost" data-action="openauth">Log In</button>`}
            </div>
          </header>
          <div class="content">${page === 'Home' ? home() : page === 'Feed' ? feed() : page === 'Charts' ? charts() : page === 'Rewards' ? rewardsPage() : page === 'Studio' ? studio() : page === 'Library' ? library() : page === 'Artist' ? artistPage() : searchPage()}<div class="footer-note">SPOTWAV · Community Music Social Network · spotwav.space</div></div>
        </main>
      </div>
      ${t ? `<div class="player"><button class="track-cover" style="border-radius:10px;flex-shrink:0" data-action="player" aria-label="Open player">${cover(t)}</button><div class="player-title" data-openartist="${esc(t.artist)}"><div class="track-name">${esc(t.title)} ${t.vip ? '<span class="vip-badge">VIP</span>' : ''}</div><div class="track-small">@${esc(t.artist)} · ★ ${r.avg}</div></div><button aria-label="Rate song" data-action="rate" style="font-size:18px;color:var(--gold);font-weight:800">★ ${state.ratings[t.id] || ''}</button><button aria-label="Save song" data-action="save" style="font-size:22px;color:${has('saved', t.id) ? 'var(--sw-pink)' : 'var(--sw-text-subtle)'}">${has('saved', t.id) ? '♥' : '♡'}</button><button class="skip" aria-label="Previous track" data-action="prev">⏮</button><button class="play-circle" aria-label="Play or pause" data-action="play">${playing ? 'Ⅱ' : '▶'}</button><button class="skip" aria-label="Next track" data-action="next">⏭</button><div class="progress-wrap"><div class="progress" id="scrub" title="Click to seek"><i style="width:${progress}%"></i></div><span class="time-label">${fmtTime(curTime)} / ${fmtTime(durTime || 135)}</span></div></div>` : ''}
      <nav class="mobile-nav">${sections.map(([name, glyph, label]) => `<button class="${page === name ? 'active' : ''}" data-nav="${name}"><span>${glyph}</span>${label}</button>`).join('')}</nav>${modalHTML()}`;

      let el = $('#reel');
      if (el) {
        let y = 0, last = 0;
        el.addEventListener('touchstart', e => { y = e.touches[0].clientY; }, { passive: true });
        el.addEventListener('touchend', e => { let dy = y - e.changedTouches[0].clientY; if (Math.abs(dy) > 45) move(dy > 0 ? 1 : -1); }, { passive: true });
        el.addEventListener('wheel', e => { e.preventDefault(); if (Math.abs(e.deltaY) > 17 && Date.now() - last > 500) { last = Date.now(); move(e.deltaY > 0 ? 1 : -1); } }, { passive: false });
      }
      if (page === 'Feed') setupTikTokFeed();
    }

    function toast(s) {
      let d = document.createElement('div');
      d.className = 'toast';
      d.textContent = s;
      document.body.append(d);
      setTimeout(() => d.remove(), 2600);
    }

    function choose(i) {
      audio.pause();
      playing = false;
      progress = 0;
      curTime = 0;
      durTime = 0;
      currentIndex = i;
      render();
    }

    function pool() {
      return all().filter(x => tab === 'For You' || (tab === 'Following' ? has('follows', x.t.artist) : x.t.votes < 2000));
    }

    function move(d) {
      let p = (page === 'Feed' ? pool() : all());
      if (!p.length) return toast('No matching songs yet');
      let at = p.findIndex(x => x.i === currentIndex);
      choose(p[(at + d + p.length) % p.length].i);
    }

    function startPlaybackForCurrent() {
      const t = current();
      if (!t) return;
      document.querySelectorAll('.tt-vid').forEach(v => { v.pause(); v.muted = true; });
      if (isLocked(t)) { audio.pause(); playing = false; return; }
      playing = true;

      clearTimeout(listenRewardTimer);
      listenRewardTimer = setTimeout(() => {
        if (playing && current()?.id === t.id) {
          if (!has('listenedIds', t.id)) flip('listenedIds', t.id);
          awardWavePoints(`listen_${t.id}`, 2, `Listened to "${t.title}"`);
        }
      }, 6000);

      if (t.ytId) { audio.pause(); return; }
      const vid = $(`.tt-vid[data-vididx="${currentIndex}"]`) || $('#reel-video');
      if (t.video && vid) {
        audio.pause();
        vid.muted = false;
        vid.play().catch(() => { playing = false; });
        return;
      }
      if (t.url) {
        if (audio.src !== t.url) audio.src = t.url;
        audio.play().catch(() => { playing = false; });
      }
    }

    function togglePlay() {
      const t = current();
      if (!t) return;
      userInteracted = true;
      if (isLocked(t)) {
        openArtistPage(t.artist);
        return toast(`Subscribe to @${t.artist} to unlock this VIP track`);
      }
      if (playing) {
        playing = false;
        clearTimeout(listenRewardTimer);
        audio.pause();
        document.querySelectorAll('video').forEach(v => v.pause());
        render();
      } else {
        startPlaybackForCurrent();
        render();
      }
    }

    async function syncMockEngagement(trackObj, deltaVotes, deltaLikes, deltaRatingSum, deltaRatingCount) {
      if (!sb) return;
      const { data: existing } = await sb.from('engagement').select('*').eq('item_id', trackObj.id).maybeSingle();
      const payload = {
        item_id: trackObj.id,
        votes: Math.max(0, (existing?.votes || 0) + deltaVotes),
        likes: Math.max(0, (existing?.likes || 0) + deltaLikes),
        rating_sum: Math.max(0, (existing?.rating_sum || 0) + deltaRatingSum),
        rating_count: Math.max(0, (existing?.rating_count || 0) + deltaRatingCount)
      };
      await sb.from('engagement').upsert(payload);
    }

    function toggleSubscribeArtist(artistName) {
      const wasSubbed = has('follows', artistName);
      flip('follows', artistName);
      if (sb) {
        if (!wasSubbed) {
          liveSubCounts[artistName] = (liveSubCounts[artistName] || 0) + 1;
          sb.from('subscriptions').upsert({ artist: artistName, device_id: state.deviceId }).then();
        } else {
          liveSubCounts[artistName] = Math.max(0, (liveSubCounts[artistName] || 1) - 1);
          sb.from('subscriptions').delete().match({ artist: artistName, device_id: state.deviceId }).then();
        }
      }
      if (!wasSubbed) {
        awardWavePoints(`sub_${artistName}`, 5, `Subscribed to @${artistName}`);
      } else {
        toast(`Unsubscribed from @${artistName}`);
      }
    }

    document.addEventListener('click', async e => {
      const scrub = e.target.closest('#scrub');
      if (scrub) {
        const rect = scrub.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        progress = pct * 100;
        const vid = $(`.tt-vid[data-vididx="${currentIndex}"]`) || $('#reel-video');
        if (current()?.video && vid && vid.duration) { vid.currentTime = pct * vid.duration; curTime = vid.currentTime; }
        else if (audio.duration) { audio.currentTime = pct * audio.duration; curTime = audio.currentTime; }
        document.querySelectorAll('.progress i,.tt-progress i').forEach(el => el.style.width = progress + '%');
        return;
      }
      if (e.target.closest('[data-action="tapplay"]')) {
        togglePlay();
        return;
      }
      let b = e.target.closest('button,[data-track],[data-openartist],[data-subartist],[data-nav]');
      if (!b) return;
      let d = b.dataset, a = d.action, t = current();

      if (d.ttstep) {
        const feedEl = $('#tt-feed');
        if (feedEl) feedEl.scrollBy({ top: Number(d.ttstep) * feedEl.clientHeight, behavior: 'smooth' });
        return;
      }
      if (d.claimch) {
        const ch = getDailyChallenges().find(c => c.id === d.claimch);
        if (ch && ch.progress >= ch.goal) {
          const key = ch.id + '_' + state.wpDate;
          if (!has('claimedChallenges', key)) {
            flip('claimedChallenges', key);
            await awardWavePoints(`challenge_${key}`, ch.reward, `Challenge: ${ch.title}`);
            render();
          }
        }
        return;
      }
      if (d.redeem) {
        const item = REWARD_CATALOG.find(x => x.id === d.redeem);
        if (item && !has('redeemed', item.id)) {
          if (state.wpBalance < item.cost) return toast(`Need ${item.cost.toLocaleString()} WP to redeem`);
          state.wpBalance -= item.cost;
          flip('redeemed', item.id);
          state.wpLedger.unshift({ id: 'red_' + item.id, label: `Redeemed: ${item.title}`, delta: -item.cost, time: new Date().toISOString() });
          saveState();
          render();
          toast(`Unlocked "${item.title}"!`);
        }
        return;
      }
      if (d.setplan) {
        state.plan = d.setplan;
        if (d.setplan === 'Plus') {
          await awardWavePoints(`plus_bonus_${state.wpDate.slice(0, 7)}`, 300, 'SpotWav Plus Insider Monthly Bonus', true);
        }
        saveState();
        render();
        toast(`SpotWav ${d.setplan} plan activated!`);
        return;
      }
      if (d.upsrc) { uploadSource = d.upsrc; render(); return; }
      if (d.openartist) { openArtistPage(d.openartist); return; }
      if (d.subartist) { toggleSubscribeArtist(d.subartist); render(); return; }
      if (d.copyartist) {
        const url = `${SITE_URL}/#@${encodeURIComponent(d.copyartist)}`;
        navigator.clipboard?.writeText(url).then(() => toast(`SpotWav link copied: ${url}`)).catch(() => toast(url));
        return;
      }
      if (a === 'togglebio') { editingBio = !editingBio; render(); return; }

      if (d.authmode) { authMode = d.authmode; render(); return; }
      if (a === 'openauth') { modal = 'auth'; render(); return; }
      if (a === 'logout') {
        if (sb) await sb.auth.signOut();
        currentUser = null;
        userArtistName = '';
        modal = '';
        render();
        toast('Logged out');
        return;
      }
      if (d.deltrack) {
        if (!confirm('Delete this release permanently?')) return;
        if (sb) await sb.from('tracks').delete().eq('id', d.deltrack);
        await syncFromSupabase();
        toast('Release deleted');
        return;
      }

      if (d.nav) {
        page = d.nav;
        modal = '';
        genre = 'All';
        if (page === 'Feed') tab = 'For You';
        try { history.replaceState(null, '', location.pathname); } catch {}
        render();
        scrollTo(0, 0);
        return;
      }
      if (d.genre) {
        genre = d.genre;
        if (genre !== 'All' && !has('exploredGenres', genre)) flip('exploredGenres', genre);
        render();
        return;
      }
      if (d.tab) {
        tab = d.tab;
        page = 'Feed';
        modal = '';
        const p = pool();
        if (p.length) currentIndex = p[0].i;
        else { tab = 'For You'; toast('Subscribe to an artist to build this feed'); }
        render();
        return;
      }
      if (d.track !== undefined) { choose(Number(d.track)); modal = 'player'; render(); return; }
      if (d.rate !== undefined) { currentIndex = Number(d.rate); modal = 'rate'; render(); return; }
      if (d.setrate !== undefined) {
        const stars = Number(d.setrate), prev = state.ratings[t.id] || 0;
        const deltaSum = stars - prev;
        const deltaCount = prev ? 0 : 1;
        state.ratings[t.id] = stars;
        saveState();
        modal = '';
        t.ratingSum = (t.ratingSum || 5) + deltaSum;
        t.ratingCount = (t.ratingCount || 1) + deltaCount;
        if (!t.isMock) {
          if (sb) sb.from('tracks').update({ rating_sum: t.ratingSum, rating_count: t.ratingCount }).eq('id', t.id).then();
        } else {
          syncMockEngagement(t, 0, 0, deltaSum, deltaCount);
        }
        render();
        toast(`Rated "${t.title}" ${stars} ★`);
        return;
      }
      if (d.like !== undefined) {
        const target = tracks[Number(d.like)], wasLiked = has('likes', target.id);
        const delta = wasLiked ? -1 : 1;
        flip('likes', target.id);
        target.likes = Math.max(0, (target.likes || 0) + delta);
        if (!target.isMock) {
          if (sb) sb.from('tracks').update({ likes: target.likes }).eq('id', target.id).then();
        } else {
          syncMockEngagement(target, 0, delta, 0, 0);
        }
        render();
        return;
      }
      if (d.vote !== undefined) {
        const target = tracks[Number(d.vote)], wasVoted = has('votes', target.id);
        const delta = wasVoted ? -1 : 1;
        flip('votes', target.id);
        target.votes = Math.max(0, (target.votes || 0) + delta);
        if (!target.isMock) {
          if (sb) sb.from('tracks').update({ votes: target.votes }).eq('id', target.id).then();
        } else {
          syncMockEngagement(target, delta, 0, 0, 0);
        }
        if (!wasVoted) {
          await awardWavePoints(`vote_${target.id}`, 5, `Voted for "${target.title}"`);
        } else {
          toast('Community chart vote updated');
        }
        render();
        return;
      }
      if (a === 'prev' || a === 'next') { move(a === 'next' ? 1 : -1); return; }
      if (a === 'play') { togglePlay(); return; }
      if (a === 'save') {
        flip('saved', t.id);
        toast(has('saved', t.id) ? 'Added to My Music' : 'Removed from My Music');
      }
      if (['player', 'comments', 'share', 'profile', 'promote', 'rate'].includes(a)) {
        modal = a;
        if (a === 'comments' && t) loadTrackComments(t.id);
      }
      if (a === 'close') modal = '';
      if (a === 'copy') {
        const v = `${t.artist} — ${t.title} on SpotWav (${SITE_URL}/#@${encodeURIComponent(t.artist)})`;
        navigator.clipboard?.writeText(v).then(async () => {
          await awardWavePoints(`share_${t.id}`, 10, `Shared "${t.title}"`);
          render();
        }).catch(() => toast(v));
        return;
      }
      render();
    });

    document.addEventListener('keydown', e => {
      if (e.target.id === 'search' && e.key === 'Enter') { query = e.target.value; page = 'Search'; render(); }
      else if ((page === 'Home' || page === 'Feed') && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName) && !modal) {
        if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
        if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
      }
      if (e.key === 'Escape' && modal) { modal = ''; render(); }
    });

    document.addEventListener('submit', async e => {
      e.preventDefault();
      const data = new FormData(e.target);

      if (e.target.id === 'bio-form') {
        if (!currentUser || !sb) return;
        const bio = String(data.get('bio') || '').trim();
        const social_link = String(data.get('social_link') || '').trim();
        const handle = getArtistDisplay();
        await sb.from('profiles').upsert({ id: currentUser.id, artist_name: handle, bio, social_link });
        artistProfiles[handle] = { id: currentUser.id, artist_name: handle, bio, social_link };
        editingBio = false;
        render();
        toast('Artist profile updated!');
        return;
      }

      if (e.target.id === 'wall-post-form') {
        if (!currentUser || !sb) return;
        const body = String(data.get('body') || '').trim();
        const vip_only = Boolean(data.get('vip_only'));
        const handle = getArtistDisplay();
        if (!body) return;
        const { error } = await sb.from('artist_posts').insert({ user_id: currentUser.id, artist: handle, body, vip_only });
        if (!error) {
          e.target.reset();
          await openArtistPage(handle);
          toast('Posted to your community wall!');
        } else toast(error.message);
        return;
      }

      if (e.target.classList.contains('wall-reply-form')) {
        const pid = e.target.dataset.postid;
        const replyTxt = String(data.get('reply') || '').trim();
        if (replyTxt && pid) {
          const prefix = userArtistName ? `@${userArtistName}: ` : 'Fan: ';
          const fullReply = prefix + replyTxt;
          const key = 'post_' + pid;
          (state.comments[key] ??= []).push(fullReply);
          saveState();
          render();
          if (sb) sb.from('comments').insert({ track_id: key, body: fullReply }).then();
          if (replyTxt.length >= 6) await awardWavePoints(`reply_${pid}_${state.wpDate}`, 3, 'Community Wall Reply');
          else toast('Reply posted');
        }
        return;
      }

      if (e.target.id === 'auth-form') {
        if (!sb || authLoading) return;
        const email = String(data.get('email')).trim();
        const password = String(data.get('password'));
        const artistName = String(data.get('artist_name') || '').trim();
        authLoading = true;
        render();
        try {
          if (authMode === 'signup') {
            const { data: res, error } = await sb.auth.signUp({
              email,
              password,
              options: { data: { artist_name: artistName } }
            });
            if (error) throw error;
            if (res.user) {
              await sb.from('profiles').upsert({ id: res.user.id, artist_name: artistName });
              userArtistName = artistName;
            }
            toast(`Welcome to SpotWav, @${artistName}!`);
          } else {
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) throw error;
            toast('Logged in!');
          }
          modal = '';
          await syncUserSession();
        } catch (err) {
          toast(err.message || 'Authentication error');
        } finally {
          authLoading = false;
          render();
        }
        return;
      }

      if (e.target.id === 'upload') {
        if (uploading) return;
        if (!currentUser) { modal = 'auth'; render(); return toast('Please sign up or log in first'); }
        const artistName = getArtistDisplay();
        const title = String(data.get('title')).trim();
        const trackGenre = String(data.get('genre'));
        const description = String(data.get('description')).trim();
        const image = data.get('cover');
        const activeSource = ALLOW_YOUTUBE ? uploadSource : 'file';

        if (image?.size && image.size > MAX_COVER_MB * 1024 * 1024) {
          return toast(`Cover image must be under ${MAX_COVER_MB}MB`);
        }

        if (sb) {
          uploading = true;
          render();
          try {
            const ts = Date.now();
            let audioUrl = '', isVideo = false, vip = false, ytId = '';

            if (activeSource === 'youtube') {
              const rawYt = String(data.get('youtube_url') || '').trim();
              ytId = parseYouTubeId(rawYt);
              if (!ytId) throw new Error('Please enter a valid YouTube link');
              audioUrl = `https://www.youtube.com/watch?v=${ytId}`;
              isVideo = true;
            } else {
              const media = data.get('media');
              if (!media?.size) throw new Error('Choose an audio or video file');
              if (media.size > MAX_MEDIA_MB * 1024 * 1024) throw new Error(`File too large (max ${MAX_MEDIA_MB}MB)`);
              const mediaExt = (media.name.split('.').pop() || 'mp3').replace(/\W/g, '');
              const mediaPath = `${currentUser.id}/${ts}_${Math.random().toString(36).slice(2, 7)}.${mediaExt}`;
              const { error: mErr } = await sb.storage.from('soundwave').upload(mediaPath, media, { contentType: media.type });
              if (mErr) throw mErr;
              audioUrl = sb.storage.from('soundwave').getPublicUrl(mediaPath).data.publicUrl;
              isVideo = media.type.startsWith('video/');
              vip = Boolean(data.get('vip'));
            }

            let coverUrl = ytId ? `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg` : '';
            if (image?.size) {
              const imgExt = (image.name.split('.').pop() || 'jpg').replace(/\W/g, '');
              const imgPath = `${currentUser.id}/cover_${ts}_${Math.random().toString(36).slice(2, 7)}.${imgExt}`;
              const { error: iErr } = await sb.storage.from('soundwave').upload(imgPath, image, { contentType: image.type });
              if (!iErr) coverUrl = sb.storage.from('soundwave').getPublicUrl(imgPath).data.publicUrl;
            }

            const { error: dbErr } = await sb.from('tracks').insert({
              user_id: currentUser.id,
              artist: artistName,
              title,
              genre: trackGenre,
              description,
              audio_url: audioUrl,
              cover_url: coverUrl,
              is_video: isVideo,
              vip
            });
            if (dbErr) throw dbErr;

            if (!has('follows', artistName)) flip('follows', artistName);
            await awardWavePoints(`upload_${ts}`, 25, `Published "${title}"`);
            uploading = false;
            page = 'Home';
            genre = 'All';
            playing = false;
            audio.pause();
            await syncFromSupabase();
            currentIndex = 0;
            render();
            scrollTo(0, 0);
          } catch (err) {
            uploading = false;
            render();
            toast(err.message || 'Upload failed');
          }
          return;
        }
      }

      if (e.target.id === 'comment') {
        const txt = String(data.get('comment') || '').trim();
        if (txt && current()) {
          const tid = current().id;
          const prefix = userArtistName ? `@${userArtistName}: ` : '';
          const fullTxt = prefix + txt;
          (state.comments[tid] ??= []).unshift(fullTxt);
          saveState();
          render();
          if (sb) sb.from('comments').insert({ track_id: tid, body: fullTxt }).then();
          if (txt.length >= 6) {
            await awardWavePoints(`comment_${tid}_${state.wpDate}`, 3, 'Meaningful Track Feedback');
          } else {
            toast('Feedback posted');
          }
        }
      }
    });

    setInterval(() => {
      if (playing) {
        const vid = $(`.tt-vid[data-vididx="${currentIndex}"]`) || $('#reel-video');
        if (current()?.video && vid && vid.duration) {
          curTime = vid.currentTime;
          durTime = vid.duration;
          progress = (curTime / durTime) * 100;
        } else if (current()?.url && !current()?.ytId && audio.duration) {
          curTime = audio.currentTime;
          durTime = audio.duration;
          progress = (curTime / durTime) * 100;
        } else {
          progress = (progress + .5) % 100;
          curTime = (progress / 100) * 135;
          durTime = 135;
        }
        document.querySelectorAll('.progress i,.tt-progress i').forEach(e => e.style.width = progress + '%');
        document.querySelectorAll('.time-label').forEach(e => e.textContent = `${fmtTime(curTime)} / ${fmtTime(durTime || 135)}`);
      }
    }, 300);

    audio.addEventListener('ended', () => {
      playing = false;
      progress = 0;
      curTime = 0;
      render();
    });

    render();
    syncUserSession();
    syncFromSupabase();
  </script>
</body>
</html>
