let state={deviceId:'',votes:[],saved:[],likes:[],follows:[],comments:{},ratings:{}};
try{
  const old=JSON.parse(localStorage.getItem('soundwave-state-v4')||'{}');
  for(const k of ['votes','saved','likes','follows'])if(Array.isArray(old[k]))state[k]=old[k];
  if(old.comments&&typeof old.comments==='object')state.comments=old.comments;
  if(old.ratings&&typeof old.ratings==='object')state.ratings=old.ratings;
  state.deviceId=old.deviceId||('dev_'+Math.random().toString(36).slice(2,11));
}catch{state.deviceId='dev_'+Math.random().toString(36).slice(2,11)}
const saveState=()=>{try{localStorage.setItem('soundwave-state-v4',JSON.stringify(state))}catch{}};
const has=(key,v)=>state[key].includes(v),flip=(key,v)=>{state[key]=has(key,v)?state[key].filter(x=>x!==v):[...state[key],v];saveState()};

let currentUser=null,userArtistName='',authMode='signup',authLoading=false;
let tracks=SHOW_MOCKS?[...samples]:[],liveSubCounts={},page='Home',currentIndex=0,genre='All',tab='For You',modal='',query='',playing=false,progress=0,curTime=0,durTime=0,uploading=false;
const audio=new Audio();audio.crossOrigin='anonymous';

const genres=['All','Hip-Hop','R&B','Dancehall','Electronic','Pop','Rock','Other'];
const all=()=>tracks.map((t,i)=>({t,i})),current=()=>tracks[currentIndex]||tracks[0];

const getArtistDisplay=()=>userArtistName||currentUser?.user_metadata?.artist_name||currentUser?.email?.split('@')[0]||'';
const getTrackRating=(t)=>{
  const u=t.isMock?(state.ratings[t.id]||0):0;
  const sum=(t.ratingSum||5)+u;
  const count=(t.ratingCount||1)+(u?1:0);
  return {avg:(sum/count).toFixed(1),count};
};
const subCount=(artist)=>(artistSubsBase[artist]||0)+(liveSubCounts[artist]||0)+(has('follows',artist)&&!liveSubCounts[artist]?1:0);
const isLocked=(t)=>t.vip&&!has('follows',t.artist)&&!(currentUser&&t.userId===currentUser.id);
const fmtTime=(s)=>{if(!s||isNaN(s))return '0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return `${m}:${sec<10?'0':''}${sec}`};
const rank=()=>all().filter(x=>genre==='All'||x.t.genre===genre).sort((a,b)=>(b.t.votes+(b.t.isMock?Number(has('votes',b.t.id)):0))-(a.t.votes+(a.t.isMock?Number(has('votes',a.t.id)):0)));
const cover=t=>`<div class="cover" style="background:${t.color||'#403b71'}"><span class="cover-fallback">${esc(t.artist.slice(0,2).toUpperCase())}</span>${t.img?`<img src="${esc(t.img)}" alt="Cover artwork for ${esc(t.title)}" onerror="this.remove()">`:''}</div>`;
const row=(x,n)=>{
  const r=getTrackRating(x.t);
  const displayVotes=x.t.votes+(x.t.isMock?Number(has('votes',x.t.id)):0);
  const isOwner=currentUser&&x.t.userId===currentUser.id;
  return `<div class="track-row"><span class="track-rank ${n===0?'first':''}">${String(n+1).padStart(2,'0')}</span><button data-track="${x.i}" class="track-cover" aria-label="Open ${esc(x.t.title)}">${cover(x.t)}</button><div class="track-body" data-track="${x.i}"><div class="track-name">${esc(x.t.title)} ${!x.t.isMock?'<span class="live-badge">LIVE</span>':''} ${x.t.vip?'<span class="vip-badge">★ VIP</span>':''}</div><div class="track-small">${esc(x.t.artist)} · ${esc(x.t.genre)} · ★ ${r.avg} (${r.count})</div></div>${isOwner?`<button class="btn danger" style="padding:6px 10px;font-size:10px" data-deltrack="${x.t.id}" title="Delete your track">Delete</button>`:''}<button class="rate-pill" data-rate="${x.i}" title="Rate track">★ ${state.ratings[x.t.id]||r.avg}</button><button class="vote ${has('votes',x.t.id)?'voted':''}" data-vote="${x.i}">${has('votes',x.t.id)?'✓ ':'↑ '}${displayVotes.toLocaleString()}</button></div>`;
};
const chips=()=>`<div class="chips">${genres.map(g=>`<button class="chip ${genre===g?'active':''}" data-genre="${g}">${g}</button>`).join('')}</div>`;

async function syncUserSession(){
  if(!sb)return;
  const {data:{session}}=await sb.auth.getSession();
  currentUser=session?.user||null;
  if(currentUser){
    const {data:prof}=await sb.from('profiles').select('artist_name').eq('id',currentUser.id).maybeSingle();
    userArtistName=prof?.artist_name||currentUser.user_metadata?.artist_name||currentUser.email.split('@')[0];
  }else{
    userArtistName='';
  }
  render();
}

async function syncFromSupabase(){
  if(!sb)return;
  try{
    const [{data:dbTracks},{data:dbSubs}]=await Promise.all([
      sb.from('tracks').select('*').order('created_at',{ascending:false}),
      sb.from('subscriptions').select('artist')
    ]);
    liveSubCounts={};
    (dbSubs||[]).forEach(s=>{liveSubCounts[s.artist]=(liveSubCounts[s.artist]||0)+1});
    const realTracks=(dbTracks||[]).map(r=>({
      id:r.id,isMock:false,userId:r.user_id,artist:r.artist,title:r.title,genre:r.genre,
      description:r.description,url:r.audio_url,img:r.cover_url,
      video:r.is_video,vip:r.vip,votes:r.votes||1,
      ratingSum:r.rating_sum||5,ratingCount:r.rating_count||1,color:'#4a61f0'
    }));
    const prevId=current()?.id;
    tracks=SHOW_MOCKS?[...realTracks,...samples]:realTracks;
    const foundIdx=tracks.findIndex(x=>x.id===prevId);
    currentIndex=foundIdx>=0?foundIdx:0;
    render();
  }catch(err){console.error('Supabase sync error:',err)}
}

async function loadTrackComments(trackId){
  if(!sb)return;
  const {data}=await sb.from('comments').select('*').eq('track_id',trackId).order('created_at',{ascending:false});
  if(data){state.comments[trackId]=data.map(c=>c.body);render()}
}

    const artistTracks=all().filter(x=>x.t.artist===t.artist);
    const totalVotes=artistTracks.reduce((sum,x)=>sum+x.t.votes+(x.t.isMock?Number(has('votes',x.t.id)):0),0);
    inner=`<div class="artist-banner"><div class="eyebrow" style="color:#c4b3ff">CREATOR HUB</div><h2 style="margin:4px 0;color:#fff">@${esc(t.artist)}</h2><p style="color:#d6d2f0;margin:0 0 14px">${esc(t.genre)} Artist · ${subCount(t.artist).toLocaleString()} Subscribers · ${totalVotes.toLocaleString()} Total Votes</p><button class="btn ${has('follows',t.artist)?'light':'gold'}" data-action="follow">${has('follows',t.artist)?'✓ Subscribed (VIP Unlocked)':'+ Subscribe for VIP Drops'}</button></div><h3>Artist Releases (${artistTracks.length})</h3>${artistTracks.map((x,n)=>row(x,n)).join('')}`;
  }else if(modal==='rate'&&t){
    const r=getTrackRating(t),curStars=state.ratings[t.id]||0;
    inner=`<div class="eyebrow">COMMUNITY RATING</div><h2>Rate "${esc(t.title)}"</h2><p>by @${esc(t.artist)} · Current Score: ★ ${r.avg} (${r.count} ratings)</p><div class="star-picker">${[1,2,3,4,5].map(n=>`<button class="star-btn ${n<=curStars?'on':''}" data-setrate="${n}" aria-label="Rate ${n} stars">★</button>`).join('')}</div><p class="note" style="text-align:center">Your 1–5 star rating updates the live community score.</p>`;
  }else if(modal==='comments'&&t){
    inner=`<h2>Community conversation</h2>${(state.comments[t.id]||[]).map(v=>`<div class="track-row">${esc(v)}</div>`).join('')||'<p>Be the first to drop feedback on this track.</p>'}<form id="comment"><label class="field">Leave feedback <input name="comment" maxlength="280" required placeholder="What do you think of the mix/vibe?"></label><button class="btn primary" style="margin-top:13px">Post comment</button></form>`;
  }else if(modal==='share'&&t){
    const r=getTrackRating(t);
    inner=`<h2>Share this song</h2><p>${esc(t.artist)} — ${esc(t.title)} (★ ${r.avg})</p><button class="btn primary" data-action="copy">Copy song link & details</button>`;
  }else if(modal==='promote'){
    inner=`<div class="eyebrow">SOUNDWAVE FOR ARTISTS & BRANDS</div><h2>Sponsored music placements</h2><p>Place a release in a clearly labeled recommendation slot next to the discovery experience.</p><div class="panel" style="background:#f8f7ff"><b>Available advertising concepts</b><p>Sponsored spotlight · Featured reel placement · Genre sponsorship</p><p class="note">Organic ratings and chart votes can never be bought.</p></div><button class="btn primary" data-nav="Studio">Go to Artist Studio ↗</button>`;
  }else{
    const artistHandle=getArtistDisplay();
    inner=`<h2>@${esc(artistHandle)}</h2><p>${esc(currentUser?.email||'')}</p><div class="statgrid"><div class="stat"><strong>${state.follows.length}</strong><span>Subscriptions</span></div><div class="stat"><strong>${Object.keys(state.ratings).length}</strong><span>Ratings</span></div><div class="stat"><strong>${state.votes.length}</strong><span>Upvotes</span></div></div><div style="display:flex;gap:10px"><button class="btn primary" data-nav="Studio">Artist Studio</button><button class="btn ghost" data-action="logout">Log Out</button></div>`;
  }
  return `<div class="modal-layer" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="Soundwave dialog"><button class="close" data-action="close" aria-label="Close dialog">×</button>${inner}</div></div>`;
}

function render(){
  let t=current(),r=t?getTrackRating(t):{avg:'5.0',count:0};
  const artistHandle=getArtistDisplay();
  const initials=artistHandle?artistHandle.slice(0,2).toUpperCase():'SW';
  $('#app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">∿</span>soundwave<span class="brand-dot">.</span></div><div class="sidebar-label">MUSIC</div>${sections.map(([name,glyph,label])=>`<button class="nav ${page===name?'active':''}" data-nav="${name}"><span class="glyph">${glyph}</span>${label}</button>`).join('')}<div class="sidebar-label">YOUR COMMUNITY</div><button class="nav" data-nav="Charts" style="color:#ef5145"><span class="glyph">♨</span>Trending songs</button><button class="nav" data-tab="Rising"><span class="glyph">✦</span>Rising artists</button><div class="side-bottom"><b>${currentUser?`@${esc(artistHandle)}`:'Your music belongs here.'}</b><p>${currentUser?'Upload a release and grow your subscribers.':'Create a free account to publish your music.'}</p><button class="btn primary" data-nav="Studio">${currentUser?'Upload music ↗':'Join & Upload ↗'}</button></div></aside><main class="main"><header class="topbar"><div class="topbrand"><span class="brand-mark">∿</span>sw<span class="brand-dot">.</span></div><div class="search">⌕ <input id="search" type="search" placeholder="Search songs, artists, genres" value="${esc(query)}" aria-label="Search music"></div><div class="topactions"><button class="btn primary top-upload" data-nav="Studio">＋ Upload music</button>${currentUser?`<button class="avatar" data-action="profile" title="@${esc(artistHandle)}">${esc(initials)}</button>`:`<button class="btn ghost" data-action="openauth">Log In / Sign Up</button>`}</div></header><div class="content">${page==='Home'?home():page==='Feed'?feed():page==='Charts'?charts():page==='Studio'?studio():page==='Library'?library():searchPage()}<div class="footer-note">SOUNDWAVE · Community Music Social Network</div></div></main></div>${t?`<div class="player"><button class="track-cover" style="border-radius:10px;flex-shrink:0" data-action="player" aria-label="Open player">${cover(t)}</button><div class="player-title" data-action="artist"><div class="track-name">${esc(t.title)} ${t.vip?'<span class="vip-badge">VIP</span>':''}</div><div class="track-small">@${esc(t.artist)} · ★ ${r.avg}</div></div><button aria-label="Rate song" data-action="rate" style="font-size:18px;color:var(--gold);font-weight:800">★ ${state.ratings[t.id]||''}</button><button aria-label="Save song" data-action="save" style="font-size:22px;color:${has('saved',t.id)?'#ed5eaf':'#9094a4'}">${has('saved',t.id)?'♥':'♡'}</button><button class="skip" aria-label="Previous track" data-action="prev">⏮</button><button class="play-circle" aria-label="Play or pause" data-action="play">${playing?'Ⅱ':'▶'}</button><button class="skip" aria-label="Next track" data-action="next">⏭</button><div class="progress-wrap"><div class="progress" id="scrub" title="Click to seek"><i style="width:${progress}%"></i></div><span class="time-label">${fmtTime(curTime)} / ${fmtTime(durTime||135)}</span></div></div>`:''}<nav class="mobile-nav">${sections.map(([name,glyph,label])=>`<button class="${page===name?'active':''}" data-nav="${name}"><span>${glyph}</span>${label}</button>`).join('')}</nav>${modalHTML()}`;
  let el=$('#reel');
  if(el){
    let y=0,last=0;
    el.addEventListener('touchstart',e=>{y=e.touches[0].clientY},{passive:true});
    el.addEventListener('touchend',e=>{let dy=y-e.changedTouches[0].clientY;if(Math.abs(dy)>45)move(dy>0?1:-1)},{passive:true});
    el.addEventListener('wheel',e=>{e.preventDefault();if(Math.abs(e.deltaY)>17&&Date.now()-last>500){last=Date.now();move(e.deltaY>0?1:-1)}},{passive:false});
  }
}

function toast(s){let d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2600)}
function choose(i){audio.pause();playing=false;progress=0;curTime=0;durTime=0;currentIndex=i;render()}
function pool(){return all().filter(x=>tab==='For You'||(tab==='Following'?has('follows',x.t.artist):x.t.votes<2000))}
function move(d){let p=(page==='Feed'?pool():all());if(!p.length)return toast('No matching songs yet');let at=p.findIndex(x=>x.i===currentIndex);choose(p[(at+d+p.length)%p.length].i)}

function togglePlay(){
  const t=current();if(!t)return;
  if(isLocked(t)){modal='artist';render();return toast(`Subscribe to @${t.artist} to unlock this VIP track`)}
  playing=!playing;
  const vid=$('#reel-video');
  if(t.video&&vid){
    audio.pause();
    if(playing){vid.muted=false;vid.play().catch(()=>{playing=false;render()})}
    else vid.pause();
    render();return;
  }
  if(t.url){
    if(playing){
      if(audio.src!==t.url)audio.src=t.url;
      audio.play().catch(()=>{playing=false;render();toast('Click play again to start audio stream')});
    }else audio.pause();
  }
  render();
}

document.addEventListener('click',async e=>{
  const scrub=e.target.closest('#scrub');
  if(scrub){
    const rect=scrub.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
    progress=pct*100;
    const vid=$('#reel-video');
    if(current()?.video&&vid&&vid.duration){vid.currentTime=pct*vid.duration;curTime=vid.currentTime}
    else if(audio.duration){audio.currentTime=pct*audio.duration;curTime=audio.currentTime}
    document.querySelectorAll('.progress i').forEach(el=>el.style.width=progress+'%');
    return;
  }
  let b=e.target.closest('button,[data-track]');if(!b)return;
  let d=b.dataset,a=d.action,t=current();

  if(d.authmode){authMode=d.authmode;render();return}
  if(a==='openauth'){modal='auth';render();return}
  if(a==='logout'){
    if(sb)await sb.auth.signOut();
    currentUser=null;userArtistName='';modal='';render();
    toast('Logged out');return;
  }
  if(d.deltrack){
    if(!confirm('Delete this release permanently?'))return;
    if(sb)await sb.from('tracks').delete().eq('id',d.deltrack);
    await syncFromSupabase();
    toast('Release deleted');return;
  }

  if(d.nav){page=d.nav;modal='';genre='All';if(page==='Feed')tab='For You';render();scrollTo(0,0);return}
  if(d.genre){genre=d.genre;render();return}
  if(d.tab){tab=d.tab;page='Feed';modal='';const p=pool();if(p.length)currentIndex=p[0].i;else{tab='For You';toast('Subscribe to an artist to build this feed')}render();return}
  if(d.track!==undefined){choose(Number(d.track));modal='player';render();return}
  if(d.rate!==undefined){currentIndex=Number(d.rate);modal='rate';render();return}
  if(d.setrate!==undefined){
    const stars=Number(d.setrate),prev=state.ratings[t.id]||0;
    state.ratings[t.id]=stars;saveState();modal='';
    if(!t.isMock){
      t.ratingSum=(t.ratingSum||5)-prev+stars;
      if(!prev)t.ratingCount=(t.ratingCount||1)+1;
      if(sb)sb.from('tracks').update({rating_sum:t.ratingSum,rating_count:t.ratingCount}).eq('id',t.id).then();
    }
    render();toast(`Rated "${t.title}" ${stars} ★`);return;
  }
  if(d.vote!==undefined){
    const target=tracks[Number(d.vote)],wasVoted=has('votes',target.id);
    flip('votes',target.id);
    if(!target.isMock){
      target.votes=Math.max(0,(target.votes||0)+(wasVoted?-1:1));
      if(sb)sb.from('tracks').update({votes:target.votes}).eq('id',target.id).then();
    }
    render();toast('Community chart vote updated');return;
  }
  if(a==='prev'||a==='next'){move(a==='next'?1:-1);return}
  if(a==='play'){togglePlay();return}
  if(a==='save'){flip('saved',t.id);toast(has('saved',t.id)?'Added to My Music':'Removed from My Music')}
  if(a==='like')flip('likes',t.id);
  if(a==='follow'){
    const wasSubbed=has('follows',t.artist);
    flip('follows',t.artist);
    if(sb){
      if(!wasSubbed){
        liveSubCounts[t.artist]=(liveSubCounts[t.artist]||0)+1;
        sb.from('subscriptions').upsert({artist:t.artist,device_id:state.deviceId}).then();
      }else{
        liveSubCounts[t.artist]=Math.max(0,(liveSubCounts[t.artist]||1)-1);
        sb.from('subscriptions').delete().match({artist:t.artist,device_id:state.deviceId}).then();
      }
    }
    toast(has('follows',t.artist)?`Subscribed to @${t.artist}! VIP tracks unlocked`:`Unsubscribed from @${t.artist}`);
  }
  if(['artist','player','comments','share','profile','promote','rate'].includes(a)){
    modal=a;
    if(a==='comments'&&t)loadTrackComments(t.id);
  }
  if(a==='close')modal='';
  if(a==='copy'){const v=`${t.artist} — ${t.title} on Soundwave`;navigator.clipboard?.writeText(v).then(()=>toast('Song link copied')).catch(()=>toast('Clipboard unavailable'));return}
  render();
});

document.addEventListener('keydown',e=>{
  if(e.target.id==='search'&&e.key==='Enter'){query=e.target.value;page='Search';render()}
  else if((page==='Home'||page==='Feed')&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&!modal){
    if(e.key==='ArrowDown'){e.preventDefault();move(1)}
    if(e.key==='ArrowUp'){e.preventDefault();move(-1)}
  }
  if(e.key==='Escape'&&modal){modal='';render()}
});

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const data=new FormData(e.target);

  if(e.target.id==='auth-form'){
    if(!sb||authLoading)return;
    const email=String(data.get('email')).trim();
    const password=String(data.get('password'));
    const artistName=String(data.get('artist_name')||'').trim();
    authLoading=true;render();
    try{
      if(authMode==='signup'){
        const {data:res,error}=await sb.auth.signUp({
          email,password,options:{data:{artist_name:artistName}}
        });
        if(error)throw error;
        if(res.user){
          await sb.from('profiles').upsert({id:res.user.id,artist_name:artistName});
          userArtistName=artistName;
        }
        toast(`Welcome to Soundwave, @${artistName}!`);
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password});
        if(error)throw error;
        toast('Logged in!');
      }
      modal='';
      await syncUserSession();
    }catch(err){
      toast(err.message||'Authentication error');
    }finally{
      authLoading=false;render();
    }
    return;
  }

  if(e.target.id==='upload'){
    if(uploading)return;
    if(!currentUser){modal='auth';render();return toast('Please sign up or log in first')}
    const media=data.get('media'),image=data.get('cover');
    if(!media?.size)return toast('Choose an audio or video file');
    const artistName=getArtistDisplay();
    const title=String(data.get('title')).trim();
    const trackGenre=String(data.get('genre'));
    const description=String(data.get('description')).trim();
    const vip=Boolean(data.get('vip'));
    const isVideo=media.type.startsWith('video/');

    if(sb){
      uploading=true;render();
      try{
        const ts=Date.now();
        const mediaExt=(media.name.split('.').pop()||'mp3').replace(/\W/g,'');
        const mediaPath=`${currentUser.id}/${ts}_${Math.random().toString(36).slice(2,7)}.${mediaExt}`;
        const {error:mErr}=await sb.storage.from('soundwave').upload(mediaPath,media,{contentType:media.type});
        if(mErr)throw mErr;
        const audioUrl=sb.storage.from('soundwave').getPublicUrl(mediaPath).data.publicUrl;

        let coverUrl='';
        if(image?.size){
          const imgExt=(image.name.split('.').pop()||'jpg').replace(/\W/g,'');
          const imgPath=`${currentUser.id}/cover_${ts}_${Math.random().toString(36).slice(2,7)}.${imgExt}`;
          const {error:iErr}=await sb.storage.from('soundwave').upload(imgPath,image,{contentType:image.type});
          if(!iErr)coverUrl=sb.storage.from('soundwave').getPublicUrl(imgPath).data.publicUrl;
        }

        const {error:dbErr}=await sb.from('tracks').insert({
          user_id:currentUser.id,artist:artistName,title,genre:trackGenre,description,
          audio_url:audioUrl,cover_url:coverUrl,is_video:isVideo,vip
        });
        if(dbErr)throw dbErr;

        if(!has('follows',artistName))flip('follows',artistName);
        uploading=false;page='Home';genre='All';playing=false;audio.pause();
        await syncFromSupabase();
        currentIndex=0;render();scrollTo(0,0);
        toast('Your release is now LIVE on Soundwave!');
      }catch(err){
        uploading=false;render();
        toast('Upload error: '+(err.message||'Check storage policies'));
      }
      return;
    }
  }

  if(e.target.id==='comment'){
    const txt=String(data.get('comment')||'').trim();
    if(txt&&current()){
      const tid=current().id;
      const prefix=userArtistName?`@${userArtistName}: `:'';
      const fullTxt=prefix+txt;
      (state.comments[tid]??=[]).unshift(fullTxt);saveState();render();
      if(sb)sb.from('comments').insert({track_id:tid,body:fullTxt}).then();
      toast('Feedback posted');
    }
  }
});

setInterval(()=>{
  if(playing){
    const vid=$('#reel-video');
    if(current()?.video&&vid&&vid.duration){
      curTime=vid.currentTime;durTime=vid.duration;progress=(curTime/durTime)*100;
    }else if(current()?.url&&audio.duration){
      curTime=audio.currentTime;durTime=audio.duration;progress=(curTime/durTime)*100;
    }else{
      progress=(progress+.5)%100;curTime=(progress/100)*135;durTime=135;
    }
    document.querySelectorAll('.progress i').forEach(e=>e.style.width=progress+'%');
    document.querySelectorAll('.time-label').forEach(e=>e.textContent=`${fmtTime(curTime)} / ${fmtTime(durTime||135)}`);
  }
},300);
audio.addEventListener('ended',()=>{playing=false;progress=0;curTime=0;render()});
render();
syncUserSession();
syncFromSupabase();
</script></body></html>
