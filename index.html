const row=(x,n)=>`<div class="track-row"><span class="track-rank ${n===0?'first':''}">${String(n+1).padStart(2,'0')}</span><button data-track="${x.i}" class="track-cover" aria-label="Open ${esc(x.t.title)}">${cover(x.t)}</button><div class="track-body" data-track="${x.i}"><div class="track-name">${esc(x.t.title)}</div><div class="track-small">${esc(x.t.artist)} · ${esc(x.t.genre)}</div></div><button class="vote ${has('votes',x.t.id)?'voted':''}" data-vote="${x.i}">${has('votes',x.t.id)?'✓ ': '↑ '}${(x.t.votes+Number(has('votes',x.t.id))).toLocaleString()}</button></div>`;
const chips=()=>`<div class="chips">${genres.map(g=>`<button class="chip ${genre===g?'active':''}" data-genre="${g}">${g}</button>`).join('')}</div>`;
function reel(){const t=current(),i=currentIndex;return `<div class="reel-shell" id="reel"><div class="reel-media">${t.video?`<video src="${esc(t.url)}" playsinline muted loop autoplay></video>`:t.img?`<img src="${esc(t.img)}" alt="Release artwork for ${esc(t.artist)} — ${esc(t.title)}">`:cover(t)}</div><div class="reel-dim"></div><div class="reel-top"><span class="glasslabel">✦ &nbsp; NOW DISCOVERING</span><span class="reel-indicator">${i+1} / ${tracks.length}</span></div><div class="reel-arrows"><button data-action="prev" aria-label="Previous reel">⌃</button><button data-action="next" aria-label="Next reel">⌄</button></div><div class="reel-bottom"><div class="artistline"><button data-action="artist" style="font-weight:800">@${esc(t.artist.replace(/\s/g,''))}</button><button class="follow" data-action="follow">${has('follows',t.artist)?'✓ Following':'+ Follow'}</button></div><h2>${esc(t.title)}</h2><p class="reel-description">${esc(t.description||'New music on Soundwave.')} <span style="opacity:.75">#${esc(t.genre.replace(/\W/g,''))}</span></p><div class="reel-btns"><button class="btn light" data-action="play">${playing?'Ⅱ Pause':'▶ Play full track'}</button><button class="btn" style="background:#ffffff23;border:1px solid #ffffff50;color:white;backdrop-filter:blur(12px)" data-action="save">${has('saved',t.id)?'✓ Saved':'+ Save song'}</button></div></div><div class="reel-actions"><button class="action ${has('likes',t.id)?'selected':''}" data-action="like"><span class="acticon">${has('likes',t.id)?'♥':'♡'}</span>Like</button><button class="action" data-action="comments"><span class="acticon">♧</span>Comment</button><button class="action" data-action="share"><span class="acticon">↗</span>Share</button><button class="action" data-vote="${i}"><span class="acticon">↑</span>${has('votes',t.id)?'Voted':'Vote'}</button></div></div>`}
function trending(){const r=rank().slice(0,4);return `<section class="rail-card" aria-label="Top trending"><div class="rail-head"><div><div class="fire-label">🔥 &nbsp; COMMUNITY CHART</div><h2>Top Trending</h2></div><button class="text-link hot-link" data-nav="Charts">View all ↗</button></div><p class="rail-note">Songs climbing through listener votes — not paid ads.</p>${r.map((x,n)=>row(x,n)).join('')}</section>`}
function sponsor(){return `<section class="sponsor" aria-label="Sponsored placement"><div class="sponsor-tag">✧ Sponsored placement · Demo</div><div class="sponsor-art"><img src="assets/ibet-promo.webp" alt="Illustrative promotional format using a release visual"><span>YOUR RELEASE<br>HERE</span></div><h3>Your next release,<br>front and center.</h3><p>Artists and brands can reserve clearly labeled promotional spots beside music discovery.</p><button class="promo-link" data-action="promote">Promote a release ↗</button></section>`}
function releaseSpotlight(){return `<section class="release-showcase" aria-label="Featured release artwork"><div class="release-showcase-head"><div><div class="eyebrow">REAL ARTWORK · FEATURED RELEASES</div><h2>Sounds with a story.</h2><p class="sub">Discover the visuals behind the releases.</p></div><button class="text-link" data-nav="Feed">Watch reels ↗</button></div><div class="release-showcase-grid"><button class="release-big" data-track="0"><img src="assets/ibet-cover.webp" alt="LONEK I Bet on Me release artwork"><span class="release-big-meta"><small>FEATURED RELEASE</small><strong>I Bet on Me</strong><span>LONEK · Hip-Hop</span></span></button><div class="release-side"><button class="release-mini" data-track="1"><img src="assets/ohmydays-cover.webp" alt="Tyler J Oh My Days artwork"><span><strong>Oh My Days</strong><small>Tyler J</small></span></button><button class="release-mini" data-track="4"><img src="assets/igotyou-cover.webp" alt="LONEK I Got You artwork"><span><strong>I Got You</strong><small>LONEK</small></span></button></div></div></section>`}
function home(){return `<div class="heading"><div><div class="eyebrow"><span class="dot"></span> MUSIC FIRST · PEOPLE POWERED</div><h1>Your next favorite starts here.</h1><p class="sub">Swipe new music. Discover rising artists. Vote for the songs you love.</p></div></div><div class="home-layout"><section class="reel-wrap" aria-label="Music reels">${reel()}<p class="note" style="margin:10px 5px 0">Use ↑ / ↓ or swipe to explore the next reel.</p></section><aside class="rail">${trending()}${sponsor()}</aside></div><section class="bottom-strip"><div class="strip-head"><div><div class="eyebrow">BROWSE BY GENRE</div><h2>Discover more music</h2></div><button class="text-link" data-nav="Feed">See all reels ↗</button></div>${chips()}<div class="music-grid">${all().filter(x=>genre==='All'||x.t.genre===genre).slice(0,5).map(x=>`<button class="music-tile" data-track="${x.i}">${cover(x.t)}<div class="track-name">${esc(x.t.title)}</div><div class="track-small">${esc(x.t.artist)}</div></button>`).join('')||'<p class="empty">No tracks in this genre yet.</p>'}</div></section>${releaseSpotlight()}`}
function feed(){return `<div class="heading"><div><div class="eyebrow">THE MUSIC FEED</div><h1>Just music. Keep scrolling.</h1><p class="sub">New releases, live sessions, videos and previews from artists.</p></div></div><div style="max-width:710px;margin:auto">${reel()}<p class="note" style="text-align:center">Swipe or scroll in the reel to discover more.</p></div>`}
function charts(){return `<div class="heading"><div><div class="eyebrow">VOTED BY LISTENERS</div><h1>Top Charts.</h1><p class="sub">Real fan choices should shape the rankings. These example numbers are for the demo.</p></div></div><div class="board-intro"><div><div class="fire-label">🔥 THIS WEEK'S TOP TRENDING</div><h2>Listen. Vote. Move the charts.</h2><p>Community rankings and paid promotions are always separate.</p></div><div class="fire">🔥</div></div><div class="two-col"><section><div class="eyebrow" style="margin-bottom:10px">SONGS RANKED BY VOTES</div>${chips()}<div class="board">${rank().map((x,n)=>row(x,n)).join('')}</div></section><aside>${sponsor()}<div class="panel" style="margin-top:16px"><h3>How chart voting works</h3><p class="sub" style="margin-top:9px">Tap the vote button to support a track. In this prototype you can vote once per song and undo your vote.</p><p class="note">A real launch needs verified accounts and fraud prevention.</p></div></aside></div>`}
function library(){const saved=all().filter(x=>has('saved',x.t.id));return `<div class="heading"><div><div class="eyebrow">YOUR COLLECTION</div><h1>My Music.</h1><p class="sub">Save music, follow artists and keep your favorite discoveries together.</p></div></div><div class="statgrid"><div class="stat"><strong>${state.saved.length}</strong><span>Saved songs</span></div><div class="stat"><strong>${state.follows.length}</strong><span>Artists followed</span></div><div class="stat"><strong>${state.votes.length}</strong><span>Votes cast</span></div></div><div class="two-col"><section class="panel"><h2>Saved tracks</h2>${saved.map((x,n)=>row(x,n)).join('')||'<div class="empty">Songs you save from the reels appear here.</div>'}</section><aside class="panel"><h2>Following</h2>${state.follows.map(s=>`<div class="track-row"><strong>${esc(s)}</strong></div>`).join('')||'<div class="empty">Follow artists in the reel feed.</div>'}</aside></div>`}
function studio(){const mine=all().filter(x=>x.t.local);return `<div class="heading"><div><div class="eyebrow">CREATOR WORKSPACE</div><h1>Artist Studio.</h1><p class="sub">Upload a track or music video and introduce it to listeners.</p></div></div><div class="studio-layout"><form class="panel" id="upload"><h2>Submit a new release</h2><p class="sub">Share a preview or full track. It will appear immediately in this demo's feed.</p><label class="field">Music or video file <input type="file" name="media" accept="audio/*,video/*" required></label><label class="field">Cover artwork (optional) <input type="file" name="cover" accept="image/*"></label><label class="field">Song title <input name="title" required maxlength="90" placeholder="Your track name"></label><label class="field">Artist name <input name="artist" required maxlength="80" placeholder="Your artist name"></label><label class="field">Genre <select name="genre">${genres.slice(1).map(g=>`<option>${g}</option>`).join('')}</select></label><label class="field">Caption <textarea name="description" maxlength="350" rows="3" placeholder="Tell the community about your music"></textarea></label><label style="display:flex;align-items:center;gap:9px;font-size:12px;margin:20px 0"><input type="checkbox" required> I have the rights to share this music.</label><button type="submit" class="btn primary">Publish in demo ↗</button><p class="note">Uploads are local to this browser session and are not posted online.</p></form><aside><div class="panel"><div class="eyebrow">YOUR ACTIVITY</div><div class="statgrid" style="grid-template-columns:1fr"><div class="stat"><strong>${mine.length}</strong><span>Demo submissions</span></div></div><p class="sub">Your submissions appear in the music feed and community chart simulation.</p></div><div class="sponsor" style="margin-top:16px"><div class="sponsor-tag">ADVERTISING CONCEPT</div><h3>Boost visibility.</h3><p>Reserve sponsored positions without changing organic chart votes.</p><button class="promo-link" data-action="promote">Explore placements ↗</button></div></aside></div>${mine.length?`<section class="bottom-strip"><h2>Your uploaded tracks</h2>${mine.map((x,n)=>row(x,n)).join('')}</section>`:''}`}
function searchPage(){const results=all().filter(x=>(x.t.artist+' '+x.t.title+' '+x.t.genre).toLowerCase().includes(query.toLowerCase()));return `<div class="heading"><div><div class="eyebrow">FIND YOUR SOUND</div><h1>Search results</h1><p class="sub">${esc(query)}</p></div></div><div class="board">${results.map((x,n)=>row(x,n)).join('')||'<div class="empty">No matches yet. Try an artist or genre.</div>'}</div>`}
function modalHTML(){const t=current();if(!modal)return '';let inner='';if(modal==='player')inner=`<div style="max-width:190px;margin:12px auto">${cover(t)}</div><h2>${esc(t.title)}</h2><p>${esc(t.artist)}</p><div style="display:flex;justify-content:center;gap:10px"><button class="btn primary" data-action="play">${playing?'Pause':'Play'} track</button><button class="btn ghost" data-action="save">${has('saved',t.id)?'Saved ✓':'Save song'}</button></div><p class="note">${t.url?'Playing your local upload.':'Sample catalog audio is simulated; no licensed recording is bundled.'}</p>`;else if(modal==='artist')inner=`<h2>${esc(t.artist)}</h2><p>Independent music artist · ${esc(t.genre)}</p><button class="btn primary" data-action="follow">${has('follows',t.artist)?'Following ✓':'+ Follow artist'}</button><h3 style="margin-top:23px">Releases</h3>${all().filter(x=>x.t.artist===t.artist).map((x,n)=>row(x,n)).join('')}`;else if(modal==='comments')inner=`<h2>Community conversation</h2>${(state.comments[t.id]||[]).map(v=>`<div class="track-row">${esc(v)}</div>`).join('')||'<p>Be the first to comment on this track.</p>'}<form id="comment"><label class="field">Leave a comment <input name="comment" maxlength="280" required placeholder="What do you think?"></label><button class="btn primary" style="margin-top:13px">Post comment</button></form>`;else if(modal==='share')inner=`<h2>Share this song</h2><p>${esc(t.artist)} — ${esc(t.title)}</p><button class="btn primary" data-action="copy">Copy song details</button>`;else if(modal==='promote')inner=`<div class="eyebrow">SOUNDWAVE FOR ARTISTS & BRANDS</div><h2>Sponsored music placements</h2><p>Place a release in a clearly labeled recommendation slot next to the discovery experience.</p><div class="panel" style="background:#f8f7ff"><b>Available advertising concepts</b><p>Sponsored spotlight · Featured reel placement · Genre sponsorship</p><p class="note">Illustrative inventory only. No ad bookings or payments are active.</p></div><button class="btn primary" data-nav="Studio">Go to Artist Studio ↗</button>`;else inner=`<h2>Your profile</h2><p>Demo listener account — your saved tracks and votes are stored locally in this browser.</p><button class="btn primary" data-nav="Library">View My Music</button>`;return `<div class="modal-layer" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="Soundwave dialog"><button class="close" data-action="close" aria-label="Close dialog">×</button>${inner}</div></div>`}
function render(){let t=current();$('#app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">∿</span>soundwave<span class="brand-dot">.</span></div><div class="sidebar-label">MUSIC</div>${sections.map(([name,glyph,label])=>`<button class="nav ${page===name?'active':''}" data-nav="${name}"><span class="glyph">${glyph}</span>${label}</button>`).join('')}<div class="sidebar-label">YOUR COMMUNITY</div><button class="nav" data-nav="Charts" style="color:#ef5145"><span class="glyph">♨</span>Trending songs</button><button class="nav" data-tab="Rising"><span class="glyph">✦</span>Rising artists</button><div class="side-bottom"><b>Your music belongs here.</b><p>Upload a release and let listeners find it.</p><button class="btn primary" data-nav="Studio">Upload music ↗</button></div></aside><main class="main"><header class="topbar"><div class="topbrand"><span class="brand-mark">∿</span>sw<span class="brand-dot">.</span></div><div class="search">⌕ <input id="search" type="search" placeholder="Search songs, artists, genres" value="${esc(query)}" aria-label="Search music"></div><div class="topactions"><button class="btn primary top-upload" data-nav="Studio">＋ Upload music</button><button class="avatar" data-action="profile">MJ</button></div></header><div class="content">${page==='Home'?home():page==='Feed'?feed():page==='Charts'?charts():page==='Studio'?studio():page==='Library'?library():searchPage()}<div class="footer-note">SOUNDWAVE · Interactive concept · Featured release covers from MJP artwork; remaining imagery and voting totals illustrative</div></div></main></div><div class="player"><button class="track-cover" style="border-radius:10px;flex-shrink:0" data-action="player" aria-label="Open player">${cover(t)}</button><div class="player-title"><div class="track-name">${esc(t.title)}</div><div class="track-small">${esc(t.artist)}</div></div><button aria-label="Save song" data-action="save" style="font-size:22px;color:${has('saved',t.id)?'#ed5eaf':'#9094a4'}">${has('saved',t.id)?'♥':'♡'}</button><button class="skip" aria-label="Previous track" data-action="prev">⏮</button><button class="play-circle" aria-label="Play or pause" data-action="play">${playing?'Ⅱ':'▶'}</button><button class="skip" aria-label="Next track" data-action="next">⏭</button><div class="progress"><i style="width:${progress}%"></i></div><span class="note">${t.url?'LOCAL':'DEMO'}</span></div><nav class="mobile-nav">${sections.map(([name,glyph,label])=>`<button class="${page===name?'active':''}" data-nav="${name}"><span>${glyph}</span>${label}</button>`).join('')}</nav>${modalHTML()}`;let el=$('#reel');if(el){let y=0,last=0;el.addEventListener('touchstart',e=>{y=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{let dy=y-e.changedTouches[0].clientY;if(Math.abs(dy)>45)move(dy>0?1:-1)},{passive:true});el.addEventListener('wheel',e=>{e.preventDefault();if(Math.abs(e.deltaY)>17&&Date.now()-last>500){last=Date.now();move(e.deltaY>0?1:-1)}},{passive:false})}}
function toast(s){let d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2200)}function choose(i){audio.pause();playing=false;progress=0;currentIndex=i;render()}function pool(){return all().filter(x=>tab==='For You'||(tab==='Following'?has('follows',x.t.artist):x.t.votes<2000))}function move(d){let p=(page==='Feed'?pool():all());if(!p.length)return toast('No matching songs yet');let at=p.findIndex(x=>x.i===currentIndex);choose(p[(at+d+p.length)%p.length].i)}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-track]');if(!b)return;let d=b.dataset,a=d.action,t=current();if(d.nav){page=d.nav;modal='';genre='All';if(page==='Feed')tab='For You';render();scrollTo(0,0);return}if(d.genre){genre=d.genre;render();return}if(d.tab){tab=d.tab;page='Feed';modal='';const p=pool();if(p.length)currentIndex=p[0].i;else{tab='For You';toast('Follow an artist to build this feed')}render();return}if(d.track!==undefined){choose(Number(d.track));modal='player';render();return}if(d.vote!==undefined){flip('votes',tracks[Number(d.vote)].id);render();toast('Your community vote has been updated');return}if(a==='prev'||a==='next'){move(a==='next'?1:-1);return}if(a==='play'){playing=!playing;if(t.url){if(playing){if(audio.src!==t.url)audio.src=t.url;audio.play().catch(()=>{playing=false;render();toast('Unable to play selected media')})}else audio.pause()}}if(a==='save'){flip('saved',t.id);toast(has('saved',t.id)?'Added to My Music':'Removed from My Music')}if(a==='like')flip('likes',t.id);if(a==='follow')flip('follows',t.artist);if(['artist','player','comments','share','profile','promote'].includes(a))modal=a;if(a==='close')modal='';if(a==='copy'){const v=t.artist+' — '+t.title;navigator.clipboard?.writeText(v).then(()=>toast('Song details copied')).catch(()=>toast('Clipboard unavailable'));return}render()});
document.addEventListener('keydown',e=>{if(e.target.id==='search'&&e.key==='Enter'){query=e.target.value;page='Search';render()}else if((page==='Home'||page==='Feed')&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&!modal){if(e.key==='ArrowDown'){e.preventDefault();move(1)}if(e.key==='ArrowUp'){e.preventDefault();move(-1)}}if(e.key==='Escape'&&modal){modal='';render()}});
document.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.target);if(e.target.id==='upload'){const media=data.get('media'),image=data.get('cover');if(!media?.size)return toast('Choose an audio or video file');tracks.push({id:'user'+Date.now(),artist:String(data.get('artist')).trim(),title:String(data.get('title')).trim(),genre:String(data.get('genre')),description:String(data.get('description')).trim(),votes:0,img:image?.size?URL.createObjectURL(image):'',color:'#5b57af',url:URL.createObjectURL(media),video:media.type.startsWith('video/'),local:true});uploadCount++;currentIndex=tracks.length-1;page='Home';genre='All';playing=false;audio.pause();render();scrollTo(0,0);toast('Your track is now in the demo feed');return}if(e.target.id==='comment'){const txt=String(data.get('comment')||'').trim();if(txt){(state.comments[current().id]??=[]).push(txt);saveState();render();toast('Comment posted locally')}}});
setInterval(()=>{if(playing){progress=current().url&&audio.duration?audio.currentTime/audio.duration*100:(progress+.35)%100;document.querySelectorAll('.progress i').forEach(e=>e.style.width=progress+'%')}},400);audio.addEventListener('ended',()=>{playing=false;progress=0;render()});render();
</script></body></html>
