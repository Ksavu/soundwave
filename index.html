let state={deviceId:'',votes:[],saved:[],likes:[],follows:[],comments:{},ratings:{}};
try{
  const old=JSON.parse(localStorage.getItem('soundwave-state-v4')||'{}');

let currentUser=null,userArtistName='',authMode='signup',authLoading=false;

const fmtTime=(s)=>{if(!s||isNaN(s))return '0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return `${m}:${sec<10?'0':''}${sec}`};

const rank=()=>all().filter(x=>genre==='All'||x.t.genre===genre).sort((a,b)=>(b.t.votes||0)-(a.t.votes||0));

async function syncUserSession(){
  if(!sb)return;
  const {data:{session}}=await sb.auth.getSession();
  currentUser=session?.user||null;
  if(currentUser){
    const {data:prof}=await sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
    userArtistName=prof?.artist_name||currentUser.user_metadata?.artist_name||currentUser.email.split('@')[0];
    if(prof)artistProfiles[userArtistName]=prof;
  }else{
    userArtistName='';
  }
  render();
}

async function syncFromSupabase(){
  if(!sb)return;
  try{
    const [{data:dbTracks},{data:dbSubs},{data:dbProfs},{data:dbEng}]=await Promise.all([
      sb.from('tracks').select('*').order('created_at',{ascending:false}),
      sb.from('subscriptions').select('*'),
      sb.from('profiles').select('*'),
      sb.from('engagement').select('*')
    ]);
    liveSubCounts={};
    const myRemoteSubs=[];
    (dbSubs||[]).forEach(s=>{
      liveSubCounts[s.artist]=(liveSubCounts[s.artist]||0)+1;
      if(s.device_id===state.deviceId)myRemoteSubs.push(s.artist);
    });
    if(myRemoteSubs.length){
      state.follows=Array.from(new Set([...state.follows,...myRemoteSubs]));
      saveState();
    }
    (dbProfs||[]).forEach(p=>{artistProfiles[p.artist_name]=p});
    const engMap={};
    (dbEng||[]).forEach(e=>{engMap[e.item_id]=e});

    const realTracks=(dbTracks||[]).map(r=>({
      id:r.id,isMock:false,userId:r.user_id,artist:r.artist,title:r.title,genre:r.genre,
      description:r.description,url:r.audio_url,img:r.cover_url,
      video:r.is_video,vip:r.vip,votes:r.votes||1,likes:r.likes||0,
      ratingSum:r.rating_sum||5,ratingCount:r.rating_count||1,color:'#4a61f0'
    }));

    const syncedSamples=samples.map(s=>{
      const e=engMap[s.id];
      if(!e)return {...s};
      return {
        ...s,
        votes:s.votes+(e.votes||0),
        likes:s.likes+(e.likes||0),
        ratingSum:s.ratingSum+(e.rating_sum||0),
        ratingCount:s.ratingCount+(e.rating_count||0)
      };
    });

    const prevId=current()?.id;
    tracks=SHOW_MOCKS?[...realTracks,...syncedSamples]:realTracks;
    const foundIdx=tracks.findIndex(x=>x.id===prevId);
    currentIndex=foundIdx>=0?foundIdx:0;
    if(location.hash.startsWith('#@')){
      const hName=decodeURIComponent(location.hash.slice(2));
      if(hName)openArtistPage(hName);
    }else{
      render();
    }
  }catch(err){console.error('Supabase sync error:',err)}
}

  if(data){
    state.comments[trackId]=data.map(c=>c.body);
    saveState();
    render();
  }
}

  page='Artist';

  try{history.replaceState(null,'',`#@${encodeURIComponent(name)}`)}catch{}
  render();

  if(!sb)return;
  const [{data:prof},{data:posts}]=await Promise.all([
    sb.from('profiles').select('*').eq('artist_name',name).maybeSingle(),
    sb.from('artist_posts').select('*').eq('artist',name).order('created_at',{ascending:false})
  ]);
  if(prof)artistProfiles[name]=prof;
  artistPosts=posts||[];
  const combined=[...artistPosts,...(mockWallPosts[name]||[])];
  const postKeys=combined.map(p=>'post_'+p.id);
  if(postKeys.length){
    const {data:allReplies}=await sb.from('comments').select('*').in('track_id',postKeys).order('created_at',{ascending:true});
    if(allReplies){
      postKeys.forEach(k=>{state.comments[k]=[]});
      allReplies.forEach(r=>{state.comments[r.track_id].push(r.body)});
      saveState();
    }
  }
  render();
}

ticon">★</span>${state.ratings[t.id]?state.ratings[t.id]+'/5':r.avg}</button><button class="action" data-action="comments"><span class="acticon">♧</span>${(state.comments[t.id]||[]).length||'Chat'}</button><button class="action" data-action="share"><span class="acticon">↗</span>Share</button><button class="action" data-vote="${i}"><span class="acticon">↑</span>${has('votes',t.id)?'Voted':'Vote'}</button></div></div>`;

function feed(){
  const p=pool();
  const slides=(p.length?p:all()).map(x=>{
    const t=x.t,i=x.i,r=getTrackRating(t),locked=isLocked(t),activeSlide=i===currentIndex;

let ttObserver=null;
function setupTikTokFeed(){
  const feedEl=$('#tt-feed');
  if(!feedEl)return;
  if(ttObserver)ttObserver.disconnect();
  const targetSlide=feedEl.querySelector(`.tt-slide[data-slideidx="${currentIndex}"]`);
  if(targetSlide)targetSlide.scrollIntoView({behavior:'instant'});

  ttObserver=new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting&&entry.intersectionRatio>0.65){
        const idx=Number(entry.target.dataset.slideidx);
        if(idx!==currentIndex){
          currentIndex=idx;progress=0;curTime=0;durTime=0;
          if(userInteracted){
            startPlaybackForCurrent();
          }else{
            audio.pause();playing=false;
          }
          document.querySelectorAll('.tt-center-play').forEach(el=>{
            const sIdx=Number(el.closest('.tt-slide').dataset.slideidx);
            const locked=isLocked(tracks[sIdx]);
            el.innerHTML=(sIdx===currentIndex&&playing)?'':`<span class="tt-play-badge">${locked?'🔒':'▶'}</span>`;
          });
        }
      }
    });
  },{root:feedEl,threshold:0.65});
  feedEl.querySelectorAll('.tt-slide').forEach(s=>ttObserver.observe(s));
}

  const artistHandle=getArtistDisplay();
  const initials=artistHandle?artistHandle.slice(0,2).toUpperCase():'SW';
  $('#app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">∿</span>soundwave<span class="brand-dot">.</span></div><div class="sidebar-label">MUSIC</div>${sections.map(([name,glyph,label])=>`<button class="nav ${page===name?'active':''}" data-nav="${name}"><span class="glyph">${glyph}</span>${label}</button>`).join('')}${currentUser?`<button class="nav ${page==='Artist'&&selectedArtist===artistHandle?'active':''}" data-openartist="${esc(artistHandle)}"><span class="glyph">@</span>My Artist Page</button>`:''}<div class="sidebar-label">YOUR COMMUNITY</div><button class="nav" data-nav="Charts" style="color:#ef5145"><span class="glyph">♨</span>Trending songs</button><button class="nav" data-tab="Rising"><span class="glyph">✦</span>Rising artists</button><div class="side-bottom"><b>${currentUser?`@${esc(artistHandle)}`:'Your music belongs here.'}</b><p>${currentUser?'Manage your artist page, post to fans & upload.':'Create a free account to claim your artist page.'}</p><button class="btn primary" data-nav="Studio">${currentUser?'Upload music ↗':'Join & Upload ↗'}</button></div></aside><main class="main"><header class="topbar"><div class="topbrand"><span class="brand-mark">∿</span>sw<span class="brand-dot">.</span></div><div class="search">⌕ <input id="search" type="search" placeholder="Search songs, artists, genres" value="${esc(query)}" aria-label="Search music"></div><div class="topactions"><button class="btn primary top-upload" data-nav="Studio">＋ Upload music</button>${currentUser?`<button class="avatar" data-action="profile" title="@${esc(artistHandle)}">${esc(initials)}</button>`:`<button class="btn ghost" data-action="openauth">Log In / Sign Up</button>`}</div></header><div class="content">${page==='Home'?home():page==='Feed'?feed():page==='Charts'?charts():page==='Studio'?studio():page==='Library'?library():page==='Artist'?artistPage():searchPage()}<div class="footer-note">SOUNDWAVE · Community Music Social Network</div></div></main></div>${t?`<div class="player"><button class="track-cover" style="border-radius:10px;flex-shrink:0" data-action="player" aria-label="Open player">${cover(t)}</button><div class="player-title" data-openartist="${esc(t.artist)}"><div class="track-name">${esc(t.title)} ${t.vip?'<span class="vip-badge">VIP</span>':''}</div><div class="track-small">@${esc(t.artist)} · ★ ${r.avg}</div></div><button aria-label="Rate song" data-action="rate" style="font-size:18px;color:var(--gold);font-weight:800">★ ${state.ratings[t.id]||''}</button><button aria-label="Save song" data-action="save" style="font-size:22px;color:${has('saved',t.id)?'#ed5eaf':'#9094a4'}">${has('saved',t.id)?'♥':'♡'}</button><button class="skip" aria-label="Previous track" data-action="prev">⏮</button><button class="play-circle" aria-label="Play or pause" data-action="play">${playing?'Ⅱ':'▶'}</button><button class="skip" aria-label="Next track" data-action="next">⏭</button><div class="progress-wrap"><div class="progress" id="scrub" title="Click to seek"><i style="width:${progress}%"></i></div><span class="time-label">${fmtTime(curTime)} / ${fmtTime(durTime||135)}</span></div></div>`:''}<nav class="mobile-nav">${sections.map(([name,glyph,label])=>`<button class="${page===name?'active':''}" data-nav="${name}"><span>${glyph}</span>${label}</button>`).join('')}</nav>${modalHTML()}`;
  let el=$('#reel');
  if(el){
    let y=0,last=0;
    el.addEventListener('touchstart',e=>{y=e.touches[0].clientY},{passive:true});
    el.addEventListener('touchend',e=>{let dy=y-e.changedTouches[0].clientY;if(Math.abs(dy)>45)move(dy>0?1:-1)},{passive:true});
    el.addEventListener('wheel',e=>{e.preventDefault();if(Math.abs(e.deltaY)>17&&Date.now()-last>500){last=Date.now();move(e.deltaY>0?1:-1)}},{passive:false});
  }
  if(page==='Feed')setupTikTokFeed();
}

function toast(s){let d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2600)}
function choose(i){audio.pause();playing=false;progress=0;curTime=0;durTime=0;currentIndex=i;render()}
function pool(){return all().filter(x=>tab==='For You'||(tab==='Following'?has('follows',x.t.artist):x.t.votes<2000))}
function move(d){let p=(page==='Feed'?pool():all());if(!p.length)return toast('No matching songs yet');let at=p.findIndex(x=>x.i===currentIndex);choose(p[(at+d+p.length)%p.length].i)}

function startPlaybackForCurrent(){
  const t=current();if(!t)return;
  document.querySelectorAll('.tt-vid').forEach(v=>{v.pause();v.muted=true});
  if(isLocked(t)){audio.pause();playing=false;return}
  playing=true;
  const vid=$(`.tt-vid[data-vididx="${currentIndex}"]`)||$('#reel-video');
  if(t.video&&vid){
    audio.pause();
    vid.muted=false;
    vid.play().catch(()=>{playing=false});
    return;
  }
  if(t.url){
    if(audio.src!==t.url)audio.src=t.url;
    audio.play().catch(()=>{playing=false});
  }
}

function togglePlay(){
  const t=current();if(!t)return;
  userInteracted=true;
  if(isLocked(t)){openArtistPage(t.artist);return toast(`Subscribe to @${t.artist} to unlock this VIP track`)}
  if(playing){
    playing=false;
    audio.pause();
    document.querySelectorAll('video').forEach(v=>v.pause());
    render();
  }else{
    startPlaybackForCurrent();
    render();
  }
}

async function syncMockEngagement(trackObj,deltaVotes,deltaLikes,deltaRatingSum,deltaRatingCount){
  if(!sb)return;
  const {data:existing}=await sb.from('engagement').select('*').eq('item_id',trackObj.id).maybeSingle();
  const payload={
    item_id:trackObj.id,
    votes:Math.max(0,(existing?.votes||0)+deltaVotes),
    likes:Math.max(0,(existing?.likes||0)+deltaLikes),
    rating_sum:Math.max(0,(existing?.rating_sum||0)+deltaRatingSum),
    rating_count:Math.max(0,(existing?.rating_count||0)+deltaRatingCount)
  };
  await sb.from('engagement').upsert(payload);
}

function toggleSubscribeArtist(artistName){
  const wasSubbed=has('follows',artistName);
  flip('follows',artistName);
  if(sb){
    if(!wasSubbed){
      liveSubCounts[artistName]=(liveSubCounts[artistName]||0)+1;
      sb.from('subscriptions').upsert({artist:artistName,device_id:state.deviceId}).then();
    }else{
      liveSubCounts[artistName]=Math.max(0,(liveSubCounts[artistName]||1)-1);
      sb.from('subscriptions').delete().match({artist:artistName,device_id:state.deviceId}).then();
    }
  }
  toast(has('follows',artistName)?`Subscribed to @${artistName}! VIP access unlocked`:`Unsubscribed from @${artistName}`);
}

document.addEventListener('click',async e=>{
  const scrub=e.target.closest('#scrub');
  if(scrub){
    const rect=scrub.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
    progress=pct*100;
    const vid=$(`.tt-vid[data-vididx="${currentIndex}"]`)||$('#reel-video');
    if(current()?.video&&vid&&vid.duration){vid.currentTime=pct*vid.duration;curTime=vid.currentTime}
    else if(audio.duration){audio.currentTime=pct*audio.duration;curTime=audio.currentTime}
    document.querySelectorAll('.progress i,.tt-progress i').forEach(el=>el.style.width=progress+'%');
    return;
  }
  if(e.target.closest('[data-action="tapplay"]')){
    togglePlay();return;
  }
  let b=e.target.closest('button,[data-track],[data-openartist],[data-subartist]');if(!b)return;
  let d=b.dataset,a=d.action,t=current();

  if(d.openartist){openArtistPage(d.openartist);return}
  if(d.subartist){toggleSubscribeArtist(d.subartist);render();return}
  if(d.copyartist){
    const url=`${location.origin}/#@${encodeURIComponent(d.copyartist)}`;
    navigator.clipboard?.writeText(url).then(()=>toast(`Artist page link copied: #@${d.copyartist}`)).catch(()=>toast(url));
    return;
  }
  if(a==='togglebio'){editingBio=!editingBio;render();return}

  if(d.authmode){authMode=d.authmode;render();return}
  if(a==='openauth'){modal='auth';render();return}
  if(a==='logout'){
    if(sb)await sb.auth.signOut();
    currentUser=null;userArtistName='';modal='';render();
    toast('Logged out');return;
  }
  if(d.deltrack){
    if(!confirm('Delete this release permanently?'))return;
    if(sb)await sb.from('tracks').delete().eq('id',d.deltrack);
    await syncFromSupabase();
    toast('Release deleted');return;
  }

  if(d.nav){page=d.nav;modal='';genre='All';if(page==='Feed')tab='For You';try{history.replaceState(null,'',location.pathname)}catch{}render();scrollTo(0,0);return}
  if(d.genre){genre=d.genre;render();return}
  if(d.tab){tab=d.tab;page='Feed';modal='';const p=pool();if(p.length)currentIndex=p[0].i;else{tab='For You';toast('Subscribe to an artist to build this feed')}render();return}
  if(d.track!==undefined){choose(Number(d.track));modal='player';render();return}
  if(d.rate!==undefined){currentIndex=Number(d.rate);modal='rate';render();return}
  if(d.setrate!==undefined){
    const stars=Number(d.setrate),prev=state.ratings[t.id]||0;
    const deltaSum=stars-prev;
    const deltaCount=prev?0:1;
    state.ratings[t.id]=stars;saveState();modal='';
    t.ratingSum=(t.ratingSum||5)+deltaSum;
    t.ratingCount=(t.ratingCount||1)+deltaCount;
    if(!t.isMock){
      if(sb)sb.from('tracks').update({rating_sum:t.ratingSum,rating_count:t.ratingCount}).eq('id',t.id).then();
    }else{
      syncMockEngagement(t,0,0,deltaSum,deltaCount);
    }
    render();toast(`Rated "${t.title}" ${stars} ★`);return;
  }
  if(d.like!==undefined){
    const target=tracks[Number(d.like)],wasLiked=has('likes',target.id);
    const delta=wasLiked?-1:1;
    flip('likes',target.id);
    target.likes=Math.max(0,(target.likes||0)+delta);
    if(!target.isMock){
      if(sb)sb.from('tracks').update({likes:target.likes}).eq('id',target.id).then();
    }else{
      syncMockEngagement(target,0,delta,0,0);
    }
    render();return;
  }
  if(d.vote!==undefined){
    const target=tracks[Number(d.vote)],wasVoted=has('votes',target.id);
    const delta=wasVoted?-1:1;
    flip('votes',target.id);
    target.votes=Math.max(0,(target.votes||0)+delta);
    if(!target.isMock){
      if(sb)sb.from('tracks').update({votes:target.votes}).eq('id',target.id).then();
    }else{
      syncMockEngagement(target,delta,0,0,0);
    }
    render();toast('Community chart vote updated');return;
  }
  if(a==='prev'||a==='next'){move(a==='next'?1:-1);return}
  if(a==='play'){togglePlay();return}
  if(a==='save'){flip('saved',t.id);toast(has('saved',t.id)?'Added to My Music':'Removed from My Music')}
  if(['player','comments','share','profile','promote','rate'].includes(a)){
    modal=a;
    if(a==='comments'&&t)loadTrackComments(t.id);
  }
  if(a==='close')modal='';
  if(a==='copy'){const v=`${t.artist} — ${t.title} on Soundwave`;navigator.clipboard?.writeText(v).then(()=>toast('Song link copied')).catch(()=>toast('Clipboard unavailable'));return}
  render();
});

document.addEventListener('keydown',e=>{
  if(e.target.id==='search'&&e.key==='Enter'){query=e.target.value;page='Search';render()}
  else if((page==='Home'||page==='Feed')&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&!modal){
    if(e.key==='ArrowDown'){e.preventDefault();move(1)}
    if(e.key==='ArrowUp'){e.preventDefault();move(-1)}
  }
  if(e.key==='Escape'&&modal){modal='';render()}
});

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const data=new FormData(e.target);

  if(e.target.id==='bio-form'){
    if(!currentUser||!sb)return;
    const bio=String(data.get('bio')||'').trim();
    const social_link=String(data.get('social_link')||'').trim();
    const handle=getArtistDisplay();
    await sb.from('profiles').upsert({id:currentUser.id,artist_name:handle,bio,social_link});
    artistProfiles[handle]={id:currentUser.id,artist_name:handle,bio,social_link};
    editingBio=false;render();
    toast('Artist profile updated!');return;
  }

  if(e.target.id==='wall-post-form'){
    if(!currentUser||!sb)return;
    const body=String(data.get('body')||'').trim();
    const vip_only=Boolean(data.get('vip_only'));
    const handle=getArtistDisplay();
    if(!body)return;
    const {error}=await sb.from('artist_posts').insert({user_id:currentUser.id,artist:handle,body,vip_only});
    if(!error){
      e.target.reset();
      await openArtistPage(handle);
      toast('Posted to your community wall!');
    }else toast(error.message);
    return;
  }

  if(e.target.classList.contains('wall-reply-form')){
    const pid=e.target.dataset.postid;
    const replyTxt=String(data.get('reply')||'').trim();
    if(replyTxt&&pid){
      const prefix=userArtistName?`@${userArtistName}: `:'Fan: ';
      const fullReply=prefix+replyTxt;
      const key='post_'+pid;
      (state.comments[key]??=[]).push(fullReply);
      saveState();render();
      if(sb)sb.from('comments').insert({track_id:key,body:fullReply}).then();
      toast('Reply posted');
    }
    return;
  }

  if(e.target.id==='auth-form'){
    if(!sb||authLoading)return;
    const email=String(data.get('email')).trim();
    const password=String(data.get('password'));
    const artistName=String(data.get('artist_name')||'').trim();
    authLoading=true;render();
    try{
      if(authMode==='signup'){
        const {data:res,error}=await sb.auth.signUp({
          email,password,options:{data:{artist_name:artistName}}
        });
        if(error)throw error;
        if(res.user){
          await sb.from('profiles').upsert({id:res.user.id,artist_name:artistName});
          userArtistName=artistName;
        }
        toast(`Welcome to Soundwave, @${artistName}!`);
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password});
        if(error)throw error;
        toast('Logged in!');
      }
      modal='';
      await syncUserSession();
    }catch(err){
      toast(err.message||'Authentication error');
    }finally{
      authLoading=false;render();
    }
    return;
  }

  if(e.target.id==='upload'){
    if(uploading)return;
    if(!currentUser){modal='auth';render();return toast('Please sign up or log in first')}
    const media=data.get('media'),image=data.get('cover');
    if(!media?.size)return toast('Choose an audio or video file');
    const artistName=getArtistDisplay();
    const title=String(data.get('title')).trim();
    const trackGenre=String(data.get('genre'));
    const description=String(data.get('description')).trim();
    const vip=Boolean(data.get('vip'));
    const isVideo=media.type.startsWith('video/');

    if(sb){
      uploading=true;render();
      try{
        const ts=Date.now();
        const mediaExt=(media.name.split('.').pop()||'mp3').replace(/\W/g,'');
        const mediaPath=`${currentUser.id}/${ts}_${Math.random().toString(36).slice(2,7)}.${mediaExt}`;
        const {error:mErr}=await sb.storage.from('soundwave').upload(mediaPath,media,{contentType:media.type});
        if(mErr)throw mErr;
        const audioUrl=sb.storage.from('soundwave').getPublicUrl(mediaPath).data.publicUrl;

        let coverUrl='';
        if(image?.size){
          const imgExt=(image.name.split('.').pop()||'jpg').replace(/\W/g,'');
          const imgPath=`${currentUser.id}/cover_${ts}_${Math.random().toString(36).slice(2,7)}.${imgExt}`;
          const {error:iErr}=await sb.storage.from('soundwave').upload(imgPath,image,{contentType:image.type});
          if(!iErr)coverUrl=sb.storage.from('soundwave').getPublicUrl(imgPath).data.publicUrl;
        }

        const {error:dbErr}=await sb.from('tracks').insert({
          user_id:currentUser.id,artist:artistName,title,genre:trackGenre,description,
          audio_url:audioUrl,cover_url:coverUrl,is_video:isVideo,vip
        });
        if(dbErr)throw dbErr;

        if(!has('follows',artistName))flip('follows',artistName);
        uploading=false;page='Home';genre='All';playing=false;audio.pause();
        await syncFromSupabase();
        currentIndex=0;render();scrollTo(0,0);
        toast('Your release is now LIVE on Soundwave!');
      }catch(err){
        uploading=false;render();
        toast('Upload error: '+(err.message||'Check storage policies'));
      }
      return;
    }
  }

  if(e.target.id==='comment'){
    const txt=String(data.get('comment')||'').trim();
    if(txt&&current()){
      const tid=current().id;
      const prefix=userArtistName?`@${userArtistName}: `:'';
      const fullTxt=prefix+txt;
      (state.comments[tid]??=[]).unshift(fullTxt);saveState();render();
      if(sb)sb.from('comments').insert({track_id:tid,body:fullTxt}).then();
      toast('Feedback posted');
    }
  }
});

setInterval(()=>{
  if(playing){
    const vid=$(`.tt-vid[data-vididx="${currentIndex}"]`)||$('#reel-video');
    if(current()?.video&&vid&&vid.duration){
      curTime=vid.currentTime;durTime=vid.duration;progress=(curTime/durTime)*100;
    }else if(current()?.url&&audio.duration){
      curTime=audio.currentTime;durTime=audio.duration;progress=(curTime/durTime)*100;
    }else{
      progress=(progress+.5)%100;curTime=(progress/100)*135;durTime=135;
    }
    document.querySelectorAll('.progress i,.tt-progress i').forEach(e=>e.style.width=progress+'%');
    document.querySelectorAll('.time-label').forEach(e=>e.textContent=`${fmtTime(curTime)} / ${fmtTime(durTime||135)}`);
  }
},300);
audio.addEventListener('ended',()=>{playing=false;progress=0;curTime=0;render()});
render();
syncUserSession();
syncFromSupabase();
</script></body></html>
